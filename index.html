    (prog.some(function(p){return /volba orgánů/i.test(p);})?'':'<option value="elect">Volba orgánů schůze</option>')+'<option value="off">Mimo program</option>';
  var chips='<div class="field"><span class="lbl">Bod programu <span class="opt">vložíte do návrhu</span></span>'+
    '<select id="vProg" aria-label="Bod programu" onchange="pickProg(this.value)"><option value="">– vyberte bod programu –</option>'+popts+'</select><span class="err" id="vPErr"></span>'+
    '<label class="check" id="vOffL" style="display:none;height:auto;min-height:38px;padding:8px 12px;margin-top:8px"><input type="checkbox" id="vOff" onchange="updStart()">Všichni vlastníci souhlasí s projednáním bodu mimo program (čl. VI D odst. 2 stanov)</label>'+
    '<span class="hint">'+ic('info')+'<span>Hlasovat lze jen o bodech z pozvánky – o jiné věci jen za účasti a se souhlasem všech vlastníků.</span></span></div>';
  var subj='<div class="field"><span class="lbl">O čem se hlasuje <span class="opt">nastaví potřebnou většinu</span></span><select id="vSubj" aria-label="O čem se hlasuje" onchange="pickSubj(this.value)"><option value="">– vyberte –</option>'+
    SUBJ.map(function(g,gi){return '<optgroup label="'+esc(TYPES[g[0]].label)+' – '+g[1]+'">'+g[2].map(function(x,i){return '<option value="'+gi+'_'+i+'">'+esc(x)+'</option>';}).join("")+'</optgroup>';}).join("")+
    '</select><span class="hint" id="vSubjArt"></span></div>';
  var opts=Object.keys(TYPES).map(function(k){var T=TYPES[k];return '<label class="choice"><input type="radio" name="vType" value="'+k+'"'+(k==="prosta"?' checked':'')+'><span class="choice-b"><span class="choice-t">'+esc(T.label)+'</span><span class="choice-s">'+esc(T.hint)+'</span></span></label>';}).join("");
  var h=warn+card("Nové hlasování",'<span class="muted-s">usnesení č. '+num+'</span>','<div class="card-b">'+chips+
    field("Návrh usnesení",'<textarea id="vText" rows="3" placeholder="Shromáždění schvaluje …">'+esc(pre)+'</textarea>','<span class="err" id="vErr"></span>')+
    subj+'<div class="field"><span class="lbl">Potřebná většina</span><div class="choices" role="radiogroup" aria-label="Potřebná většina">'+opts+'</div></div>'+
    '<div class="form-actions"><button class="btn lg" id="vStart"'+(startMsg(m,"",false)?' disabled':'')+' onclick="startVote()">'+ic('play')+'Zahájit hlasování</button><span class="hint" id="vHint">'+(startMsg(m,"",false)||'Hlas každé přítomné jednotky zapíšete v dalším kroku.')+'</span></div></div>');
  if(m.votes.length){var nA=m.votes.filter(function(v){return v.result;}).length;
    h+='<div class="sec-h"><h2>Usnesení této schůze</h2><span class="muted-s">'+m.votes.length+' usnesení · '+nA+' schváleno · '+(m.votes.length-nA)+' neschváleno</span></div>'+m.votes.slice().reverse().map(function(v){return usnCard(m,v);}).join("");
    h+='<div class="nextbar"><span class="muted-s">Hotovo s hlasováním? Protokol se sestaví sám z přípravy, prezence a usnesení.</span><button class="btn secondary" onclick="setTab(\'zapis\')">'+ic('edit')+'Zápis</button><button class="btn" onclick="openProtokol()">'+ic('printer')+'Protokol</button></div>';}
  return h;
}
// proč nejde hlasování zahájit (prázdný text = lze)
function startMsg(m,pv,agree){
  if(!presentUnits(m).length)return 'Nejdřív označte přítomné.';
  if(!isQuorate(m))return 'Shromáždění není usnášeníschopné – hlasování nelze zahájit.';
  if(pv==="off"){if(presentUnits(m).length<m.roster.length)return 'Bod mimo program lze hlasovat jen za přítomnosti 100 % podílů (přítomno '+fmt(pct(m))+' %).';
    if(!agree)return 'Zaškrtněte souhlas všech vlastníků s projednáním bodu mimo program.';}
  return '';}
function updStart(){var m=M(),b=document.getElementById("vStart"),h=document.getElementById("vHint"),c=document.getElementById("vOff");if(!m||!b)return;
  var msg=startMsg(m,gv("vProg"),!!(c&&c.checked));b.disabled=!!msg;if(h)h.textContent=msg||'Hlas každé přítomné jednotky zapíšete v dalším kroku.';}
// bod programu: vloží text do návrhu (jen když je návrh prázdný nebo vložený automaticky)
var vIns="";
function pickProg(v){var m=M();if(!m)return;var ta=document.getElementById("vText"),l=document.getElementById("vOffL"),t="";
  if(l)l.style.display=v==="off"?"":"none";setErr("vPErr","");
  if(v==="elect")t=electionText(m);else if(v.charAt(0)==="p"){t=programOf(m)[+v.slice(1)-1]||"";if(/volba orgánů/i.test(t)&&electionText(m))t=electionText(m);}
  if(ta&&t&&(!ta.value.trim()||ta.value===vIns)){ta.value=t;vIns=t;}
  updStart();}
function pickSubj(v){var e=document.getElementById("vSubjArt"),g=v?SUBJ[+v.split("_")[0]]:null;if(!g){if(e)e.textContent="";return;}
  var r=document.querySelector('input[name="vType"][value="'+g[0]+'"]');if(r)r.checked=true;
  if(e)e.textContent='Potřebná většina podle '+g[1]+' stanov: '+TYPES[g[0]].label+'. Lze ručně změnit.';}
function startVote(){
  var m=M();if(!m||m.status!=="open")return;
  var r=document.querySelector('input[name="vType"]:checked'),text=gv("vText").trim(),type=r?r.value:"prosta";
  var pv=gv("vProg"),c=document.getElementById("vOff"),prog=programOf(m);
  if(!pv){setErr("vPErr","Vyberte bod programu.","vProg");return;}
  if(!text){setErr("vErr","Napište znění návrhu usnesení.","vText");focusEl("vText");return;}
  if(startMsg(m,pv,!!(c&&c.checked)))return;
  m.current={text:text,type:type,ballots:{},prog:pv==="off"?{off:true}:pv==="elect"?{elect:true}:{num:+pv.slice(1),text:prog[+pv.slice(1)-1]}};
  save();render();scrollTop();
}
function voteBar(a,n,z,x,thr,big){return '<div class="vbar'+(big?' big':'')+'"><div class="vbar-in"><span class="va" style="width:'+a+'%"></span><span class="vn" style="width:'+n+'%"></span><span class="vz" style="width:'+z+'%"></span>'+(x?'<span class="vx" style="width:'+x+'%"></span>':'')+'</div><i class="mark" style="left:'+thr+'%" title="Potřebná hranice"></i></div>';}
function liveVote(m){
  var v=m.current,t=tally(m,v),T=t.T,num=m.votes.length+1,all=T.base==="all";
  var need=(T.op===">"?"více než ":"alespoň ")+fmt(T.thr*100)+" %",baseTxt=all?"všech vlastníků":"přítomných";
  var share=t.base>0?t.ano/t.base*100:0,absent=all?Math.max(0,t.tot-t.pres):0;
  function w(x){return t.base>0?x/t.base*100:0;}
  var prop='<section class="card"><div class="card-b"><div class="over warning"><span class="pulse"></span>Probíhá hlasování · usnesení č. '+num+'</div><p class="prop-t">'+esc(v.text)+'</p>'+
    '<div class="meta"><span>'+ic('vote')+esc(T.label)+'</span></div>'+
    '<p class="explain">'+ic('info')+'<span>Hlasy se počítají podle spoluvlastnických podílů, ne podle počtu lidí – větší jednotka má větší váhu. '+
      (all?'U tohoto typu rozhoduje podíl ze <b>všech</b> vlastníků, takže kdo chybí, jako by nehlasoval pro.':'Rozhoduje podíl z <b>přítomných</b>.')+'</span></p></div></section>';
  var verdict='<div class="verdict '+(t.passed?'ok':'no')+'"><div class="verdict-h"><span class="verdict-ic">'+ic(t.passed?'check':'x')+'</span><div><div class="verdict-t">'+(t.passed?'Usnesení by bylo přijato':'Usnesení by nebylo přijato')+'</div>'+
    '<div class="verdict-s">'+(t.quorate?'':'<b>Shromáždění není usnášeníschopné</b> ('+fmt(t.tot>0?t.pres/t.tot*100:0)+' % podílů) · ')+'Pro je <b>'+fmt(share)+' %</b> podílů '+baseTxt+' · potřeba '+need+'</div></div></div>'+voteBar(w(t.ano),w(t.ne),w(t.zdr),w(absent),T.thr*100,true)+
    '<div class="legend"><span><i class="dot a"></i>ANO <b>'+t.cA+'</b></span><span><i class="dot n"></i>NE <b>'+t.cN+'</b></span><span><i class="dot z"></i>Zdržel se <b>'+t.cZ+'</b></span>'+(t.cU?'<span class="nez-t">Nezapsáno '+t.cU+'</span>':'')+(absent?'<span><i class="dot x"></i>Nepřítomní</span>':'')+'</div></div>';
  var dis=t.cU?' disabled':'';
  var acts='<div class="vact"><button class="btn success lg"'+dis+' onclick="closeVote()">'+ic('check')+'Uzavřít hlasování</button>'+(t.cU?'<button class="btn secondary" onclick="restAbstain()">Zbývající označit jako Zdržel se</button>':'')+'<button class="btn ghost danger-text" onclick="cancelVote()">Zrušit hlasování</button></div>';
  var rows=presentUnits(m).map(function(u){var b=v.ballots[u.id],a=m.att[u.id]||{};
    return '<div class="vrow'+(b?'':' nez')+'"><span class="p-unit">'+esc(u.unit)+'</span><span class="p-name">'+whoHtml(a.who,a.pm,u)+(b?'':'<span class="nez-t">nezapsáno</span>')+'</span><span class="p-pod">'+fmtP(u.podil)+' %</span><span class="vseg" role="group" aria-label="Hlas – '+esc(u.unit)+'">'+
      ["ANO","NE","ZDR"].map(function(x){var on=b===x;return '<button class="vb '+x.toLowerCase()+(on?' sel':'')+'" aria-pressed="'+on+'" data-f="vb'+u.id+x+'" onclick="cast('+u.id+',\''+x+'\')">'+(on?ic(x==="ANO"?'check':x==="NE"?'x':'minus'):'')+(x==="ZDR"?"Zdržel se":x)+'</button>';}).join("")+'</span></div>';}).join("");
  var ballots=card("Hlasy přítomných ("+presentUnits(m).length+")",'<div class="row"><span class="muted-s">Nastavit všem:</span><button class="btn secondary sm" onclick="setAllVotes(\'ANO\')">ANO</button><button class="btn secondary sm" onclick="setAllVotes(\'NE\')">NE</button><button class="btn secondary sm" onclick="setAllVotes(\'ZDR\')">Zdržel se</button></div>',
    '<div class="list"><div class="vrow head" aria-hidden="true"><span>Jednotka</span><span>Hlasuje</span><span class="p-pod">Podíl</span><span>Hlas</span></div>'+rows+'</div>');
  return prop+'<div class="votegrid">'+ballots+'<div class="vside">'+verdict+acts+'</div></div>'+
    '<div class="nextbar mobile-only"><button class="btn ghost danger-text" onclick="cancelVote()">Zrušit hlasování</button></div><div class="vmini-sp mobile-only"></div>'+
    '<div class="vmini '+(t.passed?'ok':'no')+'" aria-hidden="true">'+ic(t.passed?'check':'x')+'<b>'+(t.passed?'Bylo by přijato':'Nebylo by přijato')+' · '+fmt(share)+' %</b><button class="btn success sm" tabindex="-1"'+dis+' onclick="closeVote()">Uzavřít</button></div>';
}
function whoHtml(who,pm,u){who=String(who||"").trim();return who?esc(who)+(pm?' <span class="muted-n">· plná moc</span>':''):(u.owner?esc(u.owner):unitLabel(u));}
function cast(id,x){var m=M();if(!m||!m.current)return;m.current.ballots[id]=x;save();render();}
// vědomá volba: jen jednotky bez zapsaného hlasu dostanou „Zdržel se“

function setAllVotes(x){var m=M();if(!m||!m.current)return;presentUnits(m).forEach(function(u){m.current.ballots[u.id]=x;});save();render();}
function cancelVote(){var m=M();if(!m||!m.current)return;

    onOk:function(){m.current=null;save();render();toast("Hlasování zrušeno","info");}});}
function closeVote(){

    text:'<p>Výsledek bude konečný: <b>'+(t0.passed?'PŘIJATO':'NEPŘIJATO')+'</b>'+(t0.quorate?'':' – '+NOQ)+'</p><p class="muted-s">ANO '+t0.cA+' · NE '+t0.cN+' · Zdržel se '+t0.cZ+'</p>',ok:"Uzavřít hlasování",okClass:"success",cancel:"Zpět",
    onOk:function(){

      m.votes.push({num:num,text:v.text,type:v.type,time:new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"}),ballots:Object.assign({},v.ballots),result:t.passed,
        reason:t.quorate?undefined:NOQ,

          units:presentUnits(m).map(function(u){var a=m.att[u.id]||{};return {unit:u.unit,owner:u.owner,who:String(a.who||"").trim(),pm:!!a.pm,podil:u.podil,vote:v.ballots[u.id]||"ZDR"};})}});

      toast("Usnesení č. "+num+" uloženo – "+(t.passed?"schváleno":"neschváleno"),"success",{label:"+ Úkol",fn:function(){taskFromVote(num);}});

// --- výsledky / usnesení schůze ---
function tabVysledky(m){
  if(!m.votes.length)return card("","",empty("filecheck","Zatím žádná usnesení",m.status==="open"?"Usnesení vzniknou uzavřením hlasování.":"Na této schůzi se nehlasovalo.",m.status==="open"?'<button class="btn" onclick="setTab(\'hlasovani\')">Přejít na hlasování</button>':''));
  var nA=m.votes.filter(function(v){return v.result;}).length,nN=m.votes.length-nA;
  return '<p class="muted-s mb">'+m.votes.length+' usnesení · '+nA+' '+pl(nA,"schváleno","schválena","schváleno")+' · '+nN+' '+pl(nN,"neschváleno","neschválena","neschváleno")+'</p>'+m.votes.map(function(v){return usnCard(m,v);}).join("");
}
function usnCard(m,v){
  var s=v.snap||{},key=m.id+"_"+v.num,open=!!ui.voteDetail[key],tasks=tasksOfVote(m.id,v.num);
  var T=TYPES[v.type]||TYPES.prosta,base=s.base>0?s.base:(s.pres>0?s.pres:1),absent=T.base==="all"?Math.max(0,(s.tot||0)-(s.pres||0)):0;

// ================= ZÁPIS =================
function zOf(m){if(!m.zapis||typeof m.zapis!=="object")m.zapis={};var z=m.zapis;
  ["place","chair","verifier","program","notes","convener","convOther","invDate","invHow","opener","objections","attachments"].forEach(function(k){if(typeof z[k]!=="string")z[k]="";});if(!z.convener)z.convener="vybor";
  if(!Array.isArray(z.invWays))z.invWays=[];
  delete z.status;delete z.file;if(z.prefilled===undefined)z.prefilled=false;return z;}
function inlineFmt(s){return esc(s).replace(/\*([^*\n]+)\*/g,"<b>$1</b>");}
function plainLine(s){return String(s||"").replace(/^\s*(#|-)\s*/,"").replace(/\*([^*\n]+)\*/g,"$1").trim();}
// rozbor poznámek: # nadpis, - odrážka, prázdný řádek = nový odstavec, *tučně*
function parseNotes(txt){
  var lines=String(txt||"").replace(/\r/g,"").split("\n"),out=[],sec="";
  lines.forEach(function(l,i){var t=l.trim();
    if(/^#\s*/.test(t)&&t.replace(/^#\s*/,"")){sec=t.replace(/^#\s*/,"");out.push({k:"h",t:sec,i:i});}
    else if(/^-(\s|$)/.test(t)){var x=t.replace(/^-\s*/,"").replace(/\s+[–-]\s*$/,"");if(x)out.push({k:"li",t:x,i:i,sec:sec});}
    else if(!t)out.push({k:"br",i:i});
    else out.push({k:"p",t:t.replace(/\s+[–-]\s*$/,""),i:i,sec:sec});});
  // nadpisy bez obsahu vynechat
  return out.filter(function(b,idx){if(b.k!=="h")return true;for(var j=idx+1;j<out.length;j++){if(out[j].k==="h")return false;if(out[j].k!=="br")return true;}return false;});
}
function notesHtml(txt,withTaskBtn){
  var b=parseNotes(txt),h="",inUl=false,inP=false;
  function close(){if(inUl){h+="</ul>";inUl=false;}if(inP){h+="</p>";inP=false;}}
  b.forEach(function(x){
    if(x.k==="h"){close();h+='<h3>'+inlineFmt(x.t)+'</h3>';}
    else if(x.k==="li"){if(inP){h+="</p>";inP=false;}if(!inUl){h+="<ul>";inUl=true;}
      var btn=withTaskBtn&&!/^kontrola/i.test(norm(x.sec))&&x.t.indexOf("→ úkol")<0?' <button class="zt" onclick="zTask('+x.i+')" title="Vytvořit z řádku úkol">+ úkol</button>':'';
      h+='<li>'+inlineFmt(x.t)+btn+'</li>';}
    else if(x.k==="p"){if(inUl){h+="</ul>";inUl=false;}h+=inP?'<br>'+inlineFmt(x.t):'<p>'+inlineFmt(x.t);inP=true;}
    else close();});
  close();return h;
}
function lastMeetingBefore(m){var prev=state.meetings.filter(function(x){return x.id!==m.id&&(x.date||"")<(m.date||"");}).sort(byDateDesc);return prev[0]||null;}
function prefillNotes(m){
  var prev=lastMeetingBefore(m),since=prev?prev.date:"";
  function before(t){if(t.meetingId===m.id)return false;var tm=t.meetingId?byId(t.meetingId):null;return tm?(tm.date||"")<(m.date||""):String(t.created||"").slice(0,10)<=(m.date||"9999");}
  var open=state.tasks.filter(function(t){return t.status==="open"&&before(t);}).sort(taskSortActive);
  var done=state.tasks.filter(function(t){return t.status==="done"&&before(t)&&since&&(t.doneAt||"")>=since;});
  function ln(t,extra){var p=[t.owner||"",extra||(t.due?"do "+dateCz(t.due):"")].filter(Boolean).join(", ");return "- *"+t.text.replace(/\*/g,"")+"*"+(p?" ("+p+")":"")+" – "+(t.note?t.note.replace(/\n/g," "):"");}
  var L=["# Kontrola úkolů z minula"];
  open.forEach(function(t){L.push(ln(t));});
  done.forEach(function(t){L.push(ln(t,"splněno"+(t.doneAt?" "+dateCz(t.doneAt):"")));});
  if(!open.length&&!done.length)L.push("- Žádné otevřené úkoly.");
  L.push("","# Informace výboru","- ","","# Různé","- ");
  return L.join("\n");
}
function isVolba(v){var t=norm(v.text||"");if(/(predsedajic|zapisovatel|overovatel)/.test(t))return false;return /(volb|zvol|voli )/.test(t)&&/(vybor|clen|predsed)/.test(t);}

function canPrefill(m){if(m.status==="open"&&!m.reopened)return true;var last=state.meetings.slice().sort(byDateDesc)[0];return last===m&&!!m.date&&daysTo(m.date)>=-30;}

    field("Místo",'<input type="text" value="'+esc(z.place)+'" oninput="setZ(\'place\',this.value)" placeholder="např. velká sušárna"'+dis+'>')+'</div></div>');
  if(!cm.length&&open)h+=callout("warning","users",'Složení výboru zatím není vyplněné. <button class="linkbtn" onclick="go(\'nastaveni\')">Doplňte ho v Nastavení → Výbor</button> – členové se pak nabídnou k výběru.');
  h+=card("Osoby na schůzi",'<span class="muted-s">výběr z výboru a vlastníků</span>','<div class="card-b"><div class="fields wide">'+
    field("Předsedající",personPicker("chair",z.chair,dis))+
    field("Zapisovatel",personPicker("zapisovatel",m.zapisovatel||'',dis))+

    '<p class="hint" style="margin-top:10px">'+ic('info')+'<span>Usnesení s výsledky, úkoly, usnášeníschopnost a listinu přítomných doplní aplikace do protokolu sama – nepište je sem.</span></p></div>');
  h+=card("Ukončení zasedání",'','<div class="card-b"><div class="fields">'+field('Čas ukončení <span class="opt">'+(m.status==="open"&&!m.endTime?'vyplní se sám při „Ukončit schůzi“':'propíše se do protokolu')+'</span>','<input type="time" value="'+esc(m.endTime||'')+'" onchange="setEnd(this.value)">')+'</div></div>');

    '<div class="field"><span class="lbl">Přílohy zápisu</span><div class="checks">'+ATTS.map(function(a,i){return '<label class="check"><input type="checkbox"'+(attSel(z).indexOf(i)>=0?' checked':'')+' onchange="toggleAtt('+i+',this.checked)">'+esc(a)+'</label>';}).join("")+'</div></div>'+

function setEnd(v){var m=M();if(!m)return;m.endTime=v;save();render();}
function setZ(k,v){var m=M();if(!m)return;if(m.status!=="open"&&["notes","objections","attachments"].indexOf(k)<0)return;zOf(m)[k]=v;save();if(k==="notes"){var p=document.getElementById("zPrev");if(p)p.innerHTML=notesHtml(v,true);}}
function zArea(){return document.getElementById("zNotes");}
function zApply(ta,val,s,e){ta.value=val;setZ("notes",val);try{ta.focus();ta.setSelectionRange(s,e);}catch(x){}}
function zLine(pre){var ta=zArea();if(!ta)return;var v=ta.value,s=ta.selectionStart||0,e=ta.selectionEnd||s;
  var a=v.lastIndexOf("\n",s-1)+1,b=v.indexOf("\n",e);if(b<0)b=v.length;
  var seg0=v.slice(a,b).split("\n"),all=seg0.every(function(l){return l.indexOf(pre)===0;});
  var nl=seg0.map(function(l){l=l.replace(/^(# |- )/,"");return all?l:pre+l;}).join("\n");
  var nv=v.slice(0,a)+nl+v.slice(b);zApply(ta,nv,s===e?a+nl.length:a,a+nl.length);}
function zBold(){var ta=zArea();if(!ta)return;var v=ta.value,s=ta.selectionStart||0,e=ta.selectionEnd||s;
  if(s===e){var nv=v.slice(0,s)+"**"+v.slice(e);zApply(ta,nv,s+1,s+1);return;}
  var sel=v.slice(s,e);if(/^\*[^*]+\*$/.test(sel)){var un=sel.slice(1,-1);zApply(ta,v.slice(0,s)+un+v.slice(e),s,s+un.length);return;}
  zApply(ta,v.slice(0,s)+"*"+sel+"*"+v.slice(e),s,e+2);}
function zTask(i){var m=M();if(!m)return;var L=zOf(m).notes.replace(/\r/g,"").split("\n");if(!L[i])return;
  ui.mtForm={voteNum:null,prefill:plainLine(L[i]).replace(/\s*[–-]\s*$/,""),fromLine:i,back:"zapis"};ui.openTask=null;ui.draft=null;state.subtab="ukoly";save();render();scrollTop();focusEl("tOwner");}
// ================= UKONČENÍ / ODEMČENÍ / SMAZÁNÍ =================
function endMeeting(){
  var m=M();if(!m)return;
  if(m.current){ask({alertOnly:true,icon:"vote",tone:"warning",title:"Nejdřív dokončete hlasování",text:"Probíhá hlasování o usnesení č. "+(m.votes.length+1)+". Uzavřete ho nebo zrušte – teprve potom lze schůzi ukončit.",ok:"Přejít na hlasování",onOk:function(){setTab("hlasovani");}});return;}
  ask({title:"Ukončit schůzi?",icon:"lock",text:'<ul><li>Prezence a výsledky hlasování se uzamknou (později je lze odemknout pro opravu).</li><li>Automaticky se stáhne záloha dat.</li><li>Zápis můžete doplňovat i po ukončení.</li>'+'</ul>',ok:"Ukončit schůzi",
    onOk:function(){
      if(!m.endTime)m.endTime=new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
      syncOwners(m);
      if(!m.committee&&!m.reopened)m.committee=committeeOf(null).map(function(c){return {name:String(c.name).trim(),role:String(c.role||"").trim()};});
      m.status="closed";state.subtab="vysledky";save();render();scrollTop();backup("Schůze ukončena · záloha stažena");
    }});
}
function reopenMeeting(){
  var m=M();if(!m)return;
  ask({title:"Odemknout schůzi pro opravu?",icon:"unlock",tone:"warning",text:"Prezenci a hlasování půjde znovu upravit. V protokolu bude uvedeno, že byl dodatečně opraven.",ok:"Odemknout",
    onOk:function(){m.status="open";m.reopened=new Date().toLocaleString("cs-CZ");save();toast("Schůze odemčena pro opravu","info");render();}});
}
function deleteMeeting(){
  var m=M();if(!m||m.votes.length||m.current)return;
  ask({title:"Smazat tuto schůzi?",icon:"trash",tone:"danger",text:"Na schůzi neproběhlo žádné hlasování. Případné úkoly zůstanou zachované, jen ztratí vazbu na schůzi. Akci nelze vrátit.",ok:"Smazat schůzi",danger:true,
    onOk:function(){
      state.tasks.forEach(function(t){if(t.meetingId===m.id){t.meetingId=null;t.voteNum=null;if(t.source==="usneseni")t.source="jine";}});
      state.meetings=state.meetings.filter(function(x){return x.id!==m.id;});state.viewId=null;toast("Schůze smazána");go("schuze");
    }});
}

function addDoneNote(id){var t=taskById(id);if(!t||t.status!=="done")return;var v=gv("dAdd").trim();
  if(!v){setErr("dAddErr","Napište text poznámky.","dAdd");focusEl("dAdd");return;}
  t.note=(t.note?t.note+"\n":"")+dateCz(todayISO())+": "+v;logTask(t,"Doplněna poznámka: "+clip(v,80));save();toast("Poznámka doplněna");render();}
function saveTask(id){
  var t=taskById(id);if(!t||!ui.draft||t.status==="done")return;
  var d=ui.draft,text=(d.text||"").trim();
  if(!text){setErr("dErr","Popis úkolu nemůže být prázdný.","dText");return;}
  var ch=[],was=t.status,owner=(d.owner||"").trim(),note=(d.note||"").trim();
  if(text!==t.text){ch.push("upraven popis");t.text=text;}
  if(owner!==(t.owner||"")){ch.push("odpovídá: "+(owner||"nikdo"));t.owner=owner;}
  if((d.due||"")!==(t.due||"")){ch.push("termín: "+(d.due?dateCz(d.due):"bez termínu"));t.due=d.due||"";}
  if(note!==(t.note||"")){ch.push("upravena poznámka");t.note=note;}
  if(d.status!==was){ch.push("stav: "+TSTAT[was]+" → "+TSTAT[d.status]);t.status=d.status;}
  if(t.status==="done"&&was!=="done")t.doneAt=todayISO();
  if(ch.length)logTask(t,ch.join(" · ").replace(/^./,function(c){return c.toUpperCase();}));
  ui.openTask=null;ui.draft=null;save();
  toast(!ch.length?"Beze změn":t.status==="done"&&was!=="done"?"Úkol je splněný":t.status==="cancelled"&&was!=="cancelled"?"Úkol zrušen":"Změny uloženy",ch.length?"success":"info");render();
}

function taskListHtml(){
  var q=norm(ui.taskQ).trim(),tab=ui.taskTab,ow=ui.taskOwner;
  var list=state.tasks.filter(function(t){return tab==="active"?t.status==="open":t.status===tab;})
    .filter(function(t){return !ow||(ow==="-"?!t.owner:t.owner===ow);})
    .filter(function(t){return !q||taskMatches(t,q);});
  if(!list.length){
    if(q||ow)return card("","",empty("search","Nic nenalezeno","Žádný úkol neodpovídá "+(q?"hledání „"+esc(ui.taskQ)+"“":"zvolenému filtru")+".",'<button class="btn secondary" onclick="clearTaskQ()">Zrušit filtry</button>'));
    return card("","",tab==="active"?empty("check","Žádné aktivní úkoly","Všechno je vyřešené. Nový úkol přidáte tlačítkem nahoře nebo přímo na schůzi.",'<button class="btn secondary" onclick="newTaskGlobal()">'+ic('plus')+'Nový úkol</button>')
      :empty(tab==="done"?"check":"x",tab==="done"?"Zatím žádné splněné úkoly":"Žádné zrušené úkoly",tab==="done"?"Splněné úkoly se tu ukládají i s datem a poznámkou – hodí se pro kontrolu na příští schůzi.":"Sem se přesunou úkoly, které se nakonec dělat nebudou.",""));
  }
  if(tab!=="active"){
    list.sort(function(a,b){var x=a.doneAt||a.created||"",y=b.doneAt||b.created||"";return x<y?1:x>y?-1:b.id-a.id;});
    return card("","",'<div class="list">'+list.map(function(t){return taskItem(t,false);}).join("")+'</div>');
  }
  var g={over:[],soon:[],later:[],none:[]};
  list.forEach(function(t){if(!t.due)g.none.push(t);else{var d=daysTo(t.due);if(d<0)g.over.push(t);else if(d<=14)g.soon.push(t);else g.later.push(t);}});
  ["over","soon","later"].forEach(function(k){g[k].sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0;});});
  g.none.sort(function(a,b){return b.id-a.id;});
  var groups=[["over","Po termínu","danger","alert"],["soon","Termín do 14 dnů","","clock"],["later","Později","","calendar"],["none","Bez termínu","",""]];
  return card("","",'<div class="list">'+groups.map(function(gr){var it=g[gr[0]];if(!it.length)return "";
    return '<div class="grp '+gr[2]+'">'+(gr[3]?ic(gr[3]):'')+gr[1]+'<span class="count">'+it.length+'</span></div>'+it.map(function(t){return taskItem(t,false);}).join("");}).join("")+'</div>');
}

  if(String(x.name||"").trim())ask({title:"Odebrat vlastníka?",icon:"user",tone:"danger",text:esc(x.name)+' – jednotka '+esc(u.unit)+'<br>Ukončené schůze si původní vlastníky ponechají.',ok:"Odebrat",danger:true,onOk:doIt});else doIt();}
// Začít načisto: nejdřív záloha, pak smazání všech schůzí (vč. usnesení) a úkolů; vlastníci, podíly a výbor zůstanou
function clearZone(){return '<div class="dzone"><div><b>Začít načisto</b><p class="muted-s">Smaže všechny schůze, usnesení, zápisy a úkoly. Vlastníci, podíly a výbor zůstanou. Předtím se automaticky stáhne záloha.</p></div><button class="btn danger-outline" onclick="clearAll()">'+ic('trash')+'Začít načisto…</button></div>';}
var clrTxt="";
function clrOk(){return clrTxt.trim().toUpperCase()==="SMAZAT";}
function clrCheck(v){clrTxt=v;var b=dlg&&dlg.el.querySelector('[data-a="ok"]');if(b)b.disabled=!clrOk();}
function clearAll(){var n=state.meetings.length,u=allUsn().length,t=state.tasks.length;
  if(!n&&!t){toast("Není co mazat – žádné schůze ani úkoly","info");return;}
  clrTxt="";
  ask({title:"Začít načisto?",icon:"trash",tone:"danger",danger:true,ok:"Stáhnout zálohu a smazat",
    text:'<p>Smaže se: <b>'+n+' '+pl(n,'schůze','schůze','schůzí')+'</b> (včetně '+u+' '+pl(u,'usnesení','usnesení','usnesení')+', prezence a zápisů) a <b>'+t+' '+pl(t,'úkol','úkoly','úkolů')+'</b>.</p><p>Zůstane: vlastníci a podíly, výbor.</p><p>Nejdřív se automaticky stáhne záloha – data z ní půjde obnovit přes „Obnovit ze zálohy“.</p>'+
      '<label class="field" style="margin:14px 0 0"><span class="lbl">Pro potvrzení napište SMAZAT</span><input type="text" id="clrIn" autocomplete="off" oninput="clrCheck(this.value)"></label>',
    onOk:function(){if(!clrOk())return;backup("Záloha stažena");state.meetings=[];state.tasks=[];state.viewId=null;state.subtab=null;ui.voteDetail={};resetUi();save();go("prehled");toast("Schůze a úkoly smazány · záloha stažena");}});
  var b=dlg&&dlg.el.querySelector('[data-a="ok"]');if(b)b.disabled=true;focusEl("clrIn");}
function setRestoring(on){Array.prototype.forEach.call(document.querySelectorAll("[data-restore]"),function(b){if(on){b._h=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spin"></span>Načítám zálohu…';}else if(b._h!==undefined){b.disabled=false;b.innerHTML=b._h;}});}
function restore(ev){
  var f=ev.target.files[0];if(!f)return;var r=new FileReader();setRestoring(true);
  function fail(why){setRestoring(false);ask({alertOnly:true,icon:"alert",tone:"danger",title:"Zálohu se nepodařilo načíst",text:'<p>'+why+'</p><p><b>Vaše současná data zůstala beze změny.</b> Vyberte soubor .json stažený tlačítkem „Stáhnout zálohu“.</p>',ok:"Rozumím"});}
  r.onload=function(){
    var s;try{s=JSON.parse(r.result);if(!s||!Array.isArray(s.meetings)||!Array.isArray(s.roster))throw new Error("format");}
    catch(e){fail('Soubor „'+esc(f.name)+'“ není záloha z této aplikace, nebo je poškozený.');return;}
    setRestoring(false);
    ask({title:"Obnovit data ze zálohy?",icon:"upload",tone:"warning",text:'<p>Soubor „'+esc(f.name)+'“ obsahuje '+s.meetings.length+' '+pl(s.meetings.length,"schůzi","schůze","schůzí")+' a '+(s.tasks||[]).length+' '+pl((s.tasks||[]).length,"úkol","úkoly","úkolů")+'.</p><p><b>Současná data v tomto prohlížeči budou nahrazena.</b> Pokud je chcete zachovat, nejdřív si stáhněte zálohu.</p>',ok:"Nahradit data",danger:true,
      onOk:function(){delete s.files;state=s;state.screen="prehled";resetUi();normalize();save();render();scrollTop();toast("Data byla obnovena ze zálohy");}});
  };
  r.onerror=function(){fail('Soubor „'+esc(f.name)+'“ se nepodařilo přečíst.');};
  r.readAsText(f);ev.target.value="";
}

function download(n,c,t){var b=new Blob([c],{type:t});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}
function backup(msg){var d=new Date();state.lastBackup=todayISO()+" "+pad(d.getHours())+":"+pad(d.getMinutes());save();download("svj_zaloha_"+todayISO()+"_"+pad(d.getHours())+pad(d.getMinutes())+".json",JSON.stringify(state,null,2),"application/json");toast(typeof msg==="string"?msg:"Záloha stažena");render();}
function pickRestore(){var e=document.getElementById("restoreFile");if(e)e.click();}

// ================= TISKY (prezenční listina, přehled úkolů) =================
function printBox(html,onePage,title){var p=document.getElementById("printbox");if(!p)return;p.className=onePage?"onepage":"";p.innerHTML=html;try{document.body.classList.add("pb");}catch(e){}if(title)printAs(title);else window.print();}
try{window.addEventListener("afterprint",function(){var p=document.getElementById("printbox");if(p)p.innerHTML="";try{document.body.classList.remove("pb");}catch(e){}});}catch(e){}
function printListina(){
  var R=state.roster;
  var rh=Math.max(6.5,Math.min(11,192/Math.max(1,R.length))).toFixed(1);
  var rows=R.map(function(u){return '<tr style="height:'+rh+'mm"><td class="u">'+esc(u.unit).replace(/ – (.+)$/,' <span class="pc2">$1</span>')+'</td><td class="o">'+ownersHtml(u)+'</td><td class="p">'+podilFr(+u.podil||0)+'<small>'+fmtP(+u.podil||0)+' %</small></td><td></td><td></td></tr>';}).join("");
  printBox('<h1>Prezenční listina</h1><p class="pc">Shromáždění vlastníků jednotek · SVJ v domě č.p. 2553 a 2554, Praha 3</p>'+
    '<div class="phead"><span>Schůze:</span><span>Datum:</span></div>'+
    '<table><colgroup><col style="width:28mm"><col><col style="width:23mm"><col style="width:37mm"><col style="width:33mm"></colgroup><thead><tr><th>Jednotka</th><th>Vlastník</th><th>Podíl</th><th>Zástupce</th><th>Podpis</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p class="pn">Celkem '+R.length+' jednotek, součet podílů '+fmt(rosterSum())+' %. Do sloupce Zástupce čitelně uveďte, kdo za jednotku podepisuje a hlasuje. Zmocněnec, který není vlastníkem jednotky, předloží písemnou plnou moc; jeden zmocněnec může zastupovat jen jednoho vlastníka.</p>'+
    '<div class="psig"><div>Zapisovatel</div><div>Předsedající</div></div>',true,"Prezenční listina");
}
function printTasks(){
  var today=todayISO(),open=state.tasks.filter(function(t){return t.status==="open";});
  var over=open.filter(isOverdue).sort(taskSortActive),rest=open.filter(function(t){return !isOverdue(t);}).sort(taskSortActive);
  var d=new Date();d.setFullYear(d.getFullYear()-1);var yearAgo=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  var done=state.tasks.filter(function(t){return t.status==="done"&&(t.doneAt||t.created||"")>=yearAgo;}).sort(function(a,b){return (a.doneAt||"")<(b.doneAt||"")?1:-1;});
  var canc=state.tasks.filter(function(t){return t.status==="cancelled";}).length;
  function src(t){var m=t.meetingId?byId(t.meetingId):null;return (t.source==="usneseni"&&m&&t.voteNum)?'Usnesení č. '+t.voteNum+' ('+dateCz(m.date)+')':(SRC[t.source]||"Jiné");}
  function tbl(list,doneCol){
    if(!list.length)return '<p class="pn">Žádné.</p>';
    return '<table class="fix"><thead><tr><th style="width:34%">Úkol</th><th style="width:17%">Zdroj</th><th style="width:13%">Odpovídá</th><th style="width:13%">'+(doneCol?'Splněno':'Termín')+'</th><th style="width:23%">Poznámka</th></tr></thead><tbody>'+
      list.map(function(t){return '<tr><td>'+esc(t.text)+'</td><td>'+src(t)+'</td><td>'+esc(t.owner||'—')+'</td><td class="nw">'+(doneCol?dateCz(t.doneAt||''):(t.due?dateCz(t.due):'—'))+'</td><td>'+esc(t.note||'')+'</td></tr>';}).join("")+'</tbody></table>';
  }
  printBox('<h1>Přehled úkolů SVJ</h1><p class="pc">Společenství vlastníků jednotek v domě č.p. 2553 a 2554, Praha 3 · stav k '+dateCz(today)+'</p>'+
    '<p class="pc">V řešení: <b>'+open.length+'</b> (z toho po termínu <b>'+over.length+'</b>) · splněno za posledních 12 měsíců: <b>'+done.length+'</b>'+(canc?' · zrušeno: '+canc:'')+'</p>'+
    '<h2>Po termínu</h2>'+tbl(over)+'<h2>V řešení</h2>'+tbl(rest)+'<h2>Splněno za posledních 12 měsíců</h2>'+tbl(done,true)+
    '<p class="pn" style="text-align:right">Vygenerováno '+new Date().toLocaleString("cs-CZ")+'.</p>',false,"Přehled úkolů "+dateCz(today));
}

// ================= START =================
applyHash();
render();
</script>
