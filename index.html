<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVJ Buková — schůze, usnesení, úkoly</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--ink:#18212f;--ink2:#3d4757;--muted:#6b7585;--line:#e3e7ee;--line2:#eef1f5;
  --brand:#1f3864;--brand2:#2c4f8a;--brand-bg:#eaf0f9;
  --green:#1a7f3c;--green-bg:#e7f5ec;--red:#c02a26;--red-bg:#fdecea;--amber:#9a5700;--amber-bg:#fff3e0;
  --blue:#1d5fb8;--blue-bg:#e8f0fc;--gray:#5f6b7a;--gray-bg:#eef1f5;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit}
.hidden{display:none}

/* ---------- horní lišta ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brandbox{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;font-size:.76rem;display:flex;align-items:center;justify-content:center;letter-spacing:.03em}
.app-name{font-weight:750;font-size:.98rem}
.app-sub{font-size:.78rem;color:var(--muted)}
.nav{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden}
.nav a{padding:8px 12px;border-radius:8px;color:var(--ink2);font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;user-select:none}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--brand-bg);color:var(--brand)}
.nav .cnt{background:var(--red);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px;font-weight:700}

/* ---------- stránka ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 8px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:1.4rem;font-weight:750;line-height:1.25}
.ph h1 .b{vertical-align:middle;margin-left:6px}
.phs{color:var(--muted);font-size:.9rem;margin-top:3px}
.crumb{font-size:.88rem;color:var(--brand);cursor:pointer;display:inline-block;margin-bottom:8px;font-weight:600}
.crumb:hover{text-decoration:underline}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mb{margin-bottom:12px}
.muted-s{font-size:.84rem;color:var(--muted)}
.muted-n{color:var(--muted);font-weight:400}
.fw5{font-weight:500!important}

/* ---------- karty ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card.hl{border-color:#c6d3ea;box-shadow:0 0 0 3px var(--brand-bg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h h2{font-size:1rem;font-weight:700}
.card-b{padding:14px 16px}

/* ---------- tlačítka ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 14px;font-weight:650;font-size:.92rem;cursor:pointer;background:var(--brand);color:#fff;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--brand)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:#d5dbe4}
.btn.sec:hover{background:var(--line2)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-bg)}
.btn.ok{background:var(--green)}
.btn.ok:hover{background:#15692f}
.btn.dangerline{background:var(--surface);color:var(--red);border-color:#efc2c0}
.btn.dangerline:hover{background:var(--red-bg)}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn.sm{padding:6px 10px;font-size:.84rem}
.linkbtn{background:none;border:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:.9rem}
.linkbtn:hover{text-decoration:underline}
.linkbtn.red{color:var(--red)}
.lnk{color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lnk-h{cursor:pointer}
.lnk-h:hover{text-decoration:underline}

/* ---------- stavy (badge) ---------- */
.b{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.green{color:var(--green);background:var(--green-bg)}
.b.red{color:var(--red);background:var(--red-bg)}
.b.amber{color:var(--amber);background:var(--amber-bg)}
.b.blue{color:var(--blue);background:var(--blue-bg)}
.b.gray{color:var(--gray);background:var(--gray-bg)}

/* ---------- přehled ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.kpi:hover{border-color:#c6d3ea}
.kpi-l{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi-v{font-size:1.85rem;font-weight:800;line-height:1.15;margin-top:2px}
.kpi-s{font-size:.8rem;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:#f1c9c7;background:#fffafa}
.kpi.alert .kpi-v,.kpi.alert .kpi-s{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-bg);border:1px solid #f1d4a0;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;cursor:pointer}
.runbar .meta{margin-top:2px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(154,87,0,.5)}70%{box-shadow:0 0 0 8px rgba(154,87,0,0)}100%{box-shadow:0 0 0 0 rgba(154,87,0,0)}}
.steps .step{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.steps .step:last-child{border-bottom:none}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--brand-bg);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- seznamy ---------- */
.list .it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
.list>.it:last-child,.list>.task:last-child .it{border-bottom:none}
.it.click{cursor:pointer}
.it.click:hover{background:#f8fafd}
.it-main{flex:1;min-width:0}
.it-t{font-weight:600;overflow-wrap:anywhere}
.it-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.84rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 14px}
.meta .red{color:var(--red);font-weight:650}
.meta .amber{color:var(--amber);font-weight:650}
.chev{color:#a0a9b6;font-size:1.1rem;width:12px;text-align:center}
.grp{padding:9px 16px 7px;font-size:.74rem;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafbfd;border-bottom:1px solid var(--line2)}
.grp span{font-weight:600;margin-left:4px}
.grp.red{color:var(--red);background:#fff8f7}
.dt{width:54px;text-align:center;flex-shrink:0;border-radius:9px;background:var(--line2);padding:6px 0}
.dt b{display:block;font-size:1.2rem;line-height:1.1}
.dt span{font-size:.7rem;color:var(--muted)}
.num-c{width:28px;height:28px;border-radius:8px;background:var(--brand-bg);color:var(--brand);font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- úkoly ---------- */
.tbar{width:4px;border-radius:4px;align-self:stretch;flex-shrink:0;min-height:36px}
.tbar.overdue{background:var(--red)}.tbar.open{background:var(--blue)}.tbar.done{background:var(--green)}.tbar.cancelled{background:#c3cad4}
.done-t{color:var(--muted);font-weight:500}
.note-l{font-size:.84rem;color:var(--ink2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task{border-bottom:1px solid var(--line2)}
.task .it{border-bottom:none!important}
.list>.task:last-child{border-bottom:none}
.task.is-open{background:#fbfcfe}
.detail{padding:4px 16px 16px 32px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:.9rem;margin:6px 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.quote{border-left:3px solid var(--line);padding:2px 10px;margin:0 0 6px;color:var(--ink2)}
.formbox{background:#fafbfd;border-bottom:1px solid var(--line2)}

/* ---------- schůze ---------- */
.strip{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:11px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;font-size:.9rem;color:var(--ink2)}
.q{font-weight:750;padding:5px 12px;border-radius:999px;font-size:.84rem}
.q.ok{background:var(--green-bg);color:var(--green)}.q.no{background:var(--red-bg);color:var(--red)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 16px;overflow-x:auto;overflow-y:hidden}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .n{font-size:.74rem;background:var(--line2);color:var(--ink2);border-radius:999px;padding:1px 7px;font-weight:650}
.tabs .n.live{background:var(--amber-bg);color:var(--amber)}
.nextbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.tog{min-width:124px;padding:9px 12px;border-radius:9px;border:1px solid #d5dbe4;background:var(--surface);font-weight:700;color:var(--muted);cursor:pointer}
.tog.on{background:var(--green);border-color:var(--green);color:#fff}
tr.pres-on td{background:#f6fbf7}
.c-unit{font-weight:700;color:var(--ink2);width:56px}
.vote-text{font-size:1.05rem;font-weight:600;margin:4px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.live{border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;border:1px solid transparent}
.live.ok{background:var(--green-bg);border-color:#c5e6d0}.live.no{background:var(--red-bg);border-color:#f4c9c6}
.live .big{font-size:1.3rem;font-weight:800}
.live.ok .big{color:var(--green)}.live.no .big{color:var(--red)}
.live .expl{font-size:.9rem;margin-top:3px;color:var(--ink2)}
.counts{display:flex;gap:6px 20px;flex-wrap:wrap;margin-top:10px;font-size:.95rem}
.counts.sm{font-size:.88rem;margin-top:0}
.vote-btns{display:flex;gap:6px}
.vb{flex:1;min-width:74px;padding:10px 8px;border-radius:9px;border:1px solid #d5dbe4;background:var(--surface);font-weight:700;font-size:.88rem;color:var(--ink2);cursor:pointer}
.vb.ano.sel{background:var(--green);border-color:var(--green);color:#fff}
.vb.ne.sel{background:var(--red);border-color:var(--red);color:#fff}
.vb.zdr.sel{background:#8a95a5;border-color:#8a95a5;color:#fff}
.usn-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.usn-n{font-weight:750;color:var(--brand);font-size:.88rem}
.vbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line2);margin:10px 0 8px}
.vbar .va{background:var(--green)}.vbar .vn{background:var(--red)}.vbar .vz{background:#b8c0cc}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.a{background:var(--green)}.dot.n{background:var(--red)}.dot.z{background:#b8c0cc}
.usn-actions{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.usn-tasks{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.ut{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.88rem;padding:4px 0;cursor:pointer}
.ut:hover .clamp1{text-decoration:underline}

/* ---------- formuláře ---------- */
.fields{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
.field>label{font-size:.82rem;font-weight:650;color:var(--ink2)}
.field>.seg{align-self:flex-start}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{font:inherit;font-size:.95rem;padding:9px 11px;border:1px solid #d5dbe4;border-radius:9px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-bg)}
textarea{resize:vertical;line-height:1.4}
.err{color:var(--red);font-size:.84rem;min-height:0}
.err:empty{display:none}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px}
.sel-auto{width:auto!important}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 12px;border-radius:8px;font-weight:650;font-size:.88rem;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{color:var(--muted);font-weight:600;margin-left:5px}
.callout{border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px;background:var(--amber-bg);color:#6f4200}
.callout.info{background:var(--blue-bg);color:#1c4a8c}
.callout.gray{background:var(--gray-bg);color:var(--ink2)}

/* ---------- tabulky ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.73rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:left;padding:9px 12px;background:#fafbfd;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
th.num,td.num{text-align:right;white-space:nowrap}
table.edit td{padding:6px 10px}

/* ---------- prázdné stavy, toast, patička ---------- */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ei{font-size:1.7rem;margin-bottom:6px;color:#9aa4b2}
.empty h3{color:var(--ink);font-size:1rem;margin-bottom:4px}
.empty p{font-size:.9rem;margin:0 auto 12px;max-width:460px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;color:var(--muted);font-size:.78rem;padding:26px 0 18px;opacity:.8}

/* ---------- protokol (papír) ---------- */
#protokol{background:#fff;max-width:820px;margin:0 auto 10px;padding:32px 38px;color:#111;border:1px solid var(--line);border-radius:10px;font-size:.9rem;box-shadow:var(--shadow)}
#protokol h1{font-size:1.3rem;text-align:center;margin:0 0 2px}
#protokol .center{text-align:center}
#protokol h2{font-size:1.02rem;border-bottom:2px solid #111;margin:20px 0 8px;padding-bottom:3px}
#protokol h3{font-size:.95rem;margin:14px 0 4px}
#protokol p{margin:4px 0}
#protokol table{font-size:.8rem;margin:6px 0}
#protokol th,#protokol td{border:1px solid #999;padding:4px 6px;background:none;color:#111;text-transform:none;letter-spacing:0;font-size:.8rem}
#protokol th{font-weight:700}
#protokol .rbig{font-weight:800;padding:4px 0}
#protokol .grn{color:#136c2e}#protokol .rd{color:#a5201d}
#protokol .usn{margin:12px 0}
#protokol .sig{margin-top:40px;display:flex;gap:40px;flex-wrap:wrap}
#protokol .sig div{flex:1;min-width:200px;border-top:1px solid #111;padding-top:4px;font-size:.8rem}
#protokol .pfoot{margin-top:24px;font-size:.72rem;color:#666;text-align:right}
#usnprint{display:none}

@media(max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .brandbox{width:100%}
  .nav{width:100%;flex-wrap:wrap}
  .nav a{padding:7px 9px;font-size:.88rem}
  .tog{min-width:92px;padding:8px}
  th,td{padding:8px}
  .ph h1{font-size:1.2rem}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dt{margin-top:6px}
  .vb{min-width:0;padding:10px 4px}
  .detail{padding-left:16px}
  #protokol{padding:20px 16px}
}

@page{size:A4;margin:14mm 15mm}
@media print{
  html,body{background:#fff}
  body *{visibility:hidden}
  #protokol,#protokol *,#usnprint,#usnprint *{visibility:visible}
  #protokol{position:absolute;left:0;top:0;width:100%;max-width:none;border:none;border-radius:0;box-shadow:none;margin:0;padding:0;font-size:10.5pt;color:#000}
  #protokol h1{font-size:15pt}
  #protokol h2{font-size:12pt;break-after:avoid;page-break-after:avoid}
  #protokol h3{font-size:10.5pt;break-after:avoid;page-break-after:avoid}
  #protokol table{page-break-inside:auto}
  #protokol thead,#usnprint thead{display:table-header-group}
  #protokol tr,#usnprint tr{break-inside:avoid;page-break-inside:avoid}
  #protokol .keep,#protokol .usn,#protokol .sig{break-inside:avoid;page-break-inside:avoid}
  #protokol p{orphans:2;widows:2}
  #usnprint{display:block;position:absolute;left:0;top:0;width:100%;color:#000;font-size:10pt}
  #usnprint h1{font-size:15pt;text-align:center;margin:0 0 2px}
  #usnprint table{width:100%;border-collapse:collapse;margin-top:8px}
  #usnprint th,#usnprint td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top;background:none;color:#000;text-transform:none;letter-spacing:0;font-size:9.5pt}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brandbox" onclick="go('prehled')"><div class="logo">SVJ</div><div><div class="app-name">SVJ Buková 2553 a 2554</div><div class="app-sub">Schůze · usnesení · úkoly</div></div></div>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer class="foot">Vytvořeno pro SVJ Buková 2553 a 2554 · © 2026 curim4am</footer>
<div id="toast"></div>

<script>
// ================= PRAVIDLA SVJ (stanovy čl. VI) =================
var TYPES={
  prosta:{label:"Prostá většina přítomných (> 50 %)",base:"present",thr:0.5,op:">",hint:"Běžná rozhodnutí. Přijato, pokud ANO tvoří více než 50 % podílů přítomných."},
  ctvrt:{label:"Tříčtvrtinová většina přítomných (≥ 75 %)",base:"present",thr:0.75,op:">=",hint:"Stanovy, řády, stavební úpravy a rekonstrukce zvyšující hodnotu, výhradní užívání společných částí. Přijato, pokud ANO tvoří alespoň 75 % podílů přítomných."},
  nadpvse:{label:"Nadpoloviční většina VŠECH vlastníků (> 50 %)",base:"all",thr:0.5,op:">",hint:"Volba člena výboru, členství v právnické osobě. Přijato, pokud ANO tvoří více než 50 % podílů všech vlastníků."},
  vsichni:{label:"Souhlas VŠECH vlastníků (100 %)",base:"all",thr:1.0,op:">=",hint:"Změna účelu užívání nebo stavby, změna podílů. Přijato jen se souhlasem všech vlastníků."}
};
var QUORUM=0.5;
var MTYPES=["Řádné shromáždění","Mimořádné shromáždění","Náhradní shromáždění","Per rollam"];
var SRC={usneseni:"Usnesení",podnet:"Podnět vlastníka",zakon:"Zákonná povinnost",jine:"Jiné"};
var TSTAT={open:"V řešení",done:"Splněno",cancelled:"Zrušeno"};
var KEY="svj_schuze";
var MON=["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];

// ================= DATA =================
function defaultRoster(){var a=[],p=100/24;for(var i=1;i<=24;i++)a.push({id:i,unit:String(i),owner:"",podil:p});return a;}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function initState(){
  var old=null;try{old=JSON.parse(localStorage.getItem("svj_hlas"));}catch(e){}
  return {roster:(old&&old.units)?old.units.map(function(u){return {id:u.id,unit:u.unit,owner:u.owner,podil:u.podil};}):defaultRoster(),
    meetings:[],tasks:[],screen:"prehled",viewId:null,subtab:null,protoVariant:"simple",lastBackup:null};
}
var state=load()||initState();

// převod starších dat a ochrana integrity
function normalize(){
  if(!Array.isArray(state.roster)||!state.roster.length)state.roster=defaultRoster();
  if(!Array.isArray(state.meetings))state.meetings=[];
  if(!Array.isArray(state.tasks))state.tasks=[];
  state.meetings.forEach(function(m){
    if(!Array.isArray(m.roster)||!m.roster.length)m.roster=state.roster.map(function(u){return {id:u.id,unit:u.unit,owner:u.owner,podil:+u.podil||0};});
    if(!m.att)m.att={};
    m.roster.forEach(function(u){if(!m.att[u.id])m.att[u.id]={present:false,proxy:false,note:""};});
    if(!Array.isArray(m.votes))m.votes=[];
    if(m.current===undefined)m.current=null;
    if(m.status!=="closed")m.status="open";
  });
  state.tasks.forEach(function(t){
    if(!t.source)t.source=t.voteNum?"usneseni":"jine";
    if(!TSTAT[t.status])t.status="open";
    if(t.note===undefined)t.note="";
    if(t.meetingId===undefined)t.meetingId=null;
    if(t.voteNum===undefined)t.voteNum=null;
  });
  var map={home:"prehled",newmeeting:"schuze",settings:"nastaveni"};
  if(map[state.screen])state.screen=map[state.screen];
  if(state.subtab==="prehled")state.subtab="vysledky";
  if(state.subtab==="protokol"){state.subtab="vysledky";if(state.screen==="meeting")state.screen="protokol";}
  if(["prehled","schuze","usneseni","ukoly","nastaveni","meeting","protokol"].indexOf(state.screen)<0)state.screen="prehled";
  if((state.screen==="meeting"||state.screen==="protokol")&&!M())state.screen="schuze";
  if(state.protoVariant!=="full")state.protoVariant="simple";
}

// ================= VÝPOČTY =================
function byId(id){for(var i=0;i<state.meetings.length;i++)if(state.meetings[i].id===id)return state.meetings[i];return null;}
function M(){return byId(state.viewId);}
function taskById(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null;}
function totalPodil(m){return m.roster.reduce(function(a,u){return a+(+u.podil||0);},0);}
function presentUnits(m){return m.roster.filter(function(u){return m.att[u.id]&&m.att[u.id].present;});}
function presentPodil(m){return presentUnits(m).reduce(function(a,u){return a+(+u.podil||0);},0);}
function pct(m){var t=totalPodil(m);return t>0?presentPodil(m)/t*100:0;}
function isQuorate(m){var t=totalPodil(m);return t>0&&presentPodil(m)/t>QUORUM;}
function pass(op,a,b){return op===">"?a>b+1e-9:a>=b-1e-9;}
function tally(m,v){
  var tot=totalPodil(m),pres=presentPodil(m),ano=0,ne=0,zdr=0,cA=0,cN=0,cZ=0;
  presentUnits(m).forEach(function(u){var b=v.ballots[u.id];
    if(b==="ANO"){ano+=+u.podil;cA++;}else if(b==="NE"){ne+=+u.podil;cN++;}else{zdr+=+u.podil;cZ++;}});
  var T=TYPES[v.type]||TYPES.prosta,base=T.base==="all"?tot:pres,ratio=base>0?ano/base:0;
  return {ano:ano,ne:ne,zdr:zdr,cA:cA,cN:cN,cZ:cZ,un:0,tot:tot,pres:pres,base:base,ratio:ratio,passed:pass(T.op,ratio,T.thr),T:T};
}
function rosterSum(){return state.roster.reduce(function(a,u){return a+(+u.podil||0);},0);}
function allUsn(){var out=[];state.meetings.forEach(function(m){m.votes.forEach(function(v){out.push({m:m,v:v,mid:m.id,date:m.date||"",num:v.num,text:v.text||"",result:v.result});});});return out;}
function usnSortDesc(a,b){if(a.date!==b.date)return a.date<b.date?1:-1;return b.num-a.num;}
function isOverdue(t){return t.status==="open"&&!!t.due&&daysTo(t.due)<0;}
function taskState(t){return t.status==="open"?(isOverdue(t)?"overdue":"open"):t.status;}
function voteOf(t){var m=t.meetingId?byId(t.meetingId):null;if(!m||!t.voteNum)return null;return m.votes.filter(function(v){return v.num===t.voteNum;})[0]||null;}
function tasksOfVote(mid,num){return state.tasks.filter(function(t){return t.meetingId===mid&&t.voteNum===num;});}
function taskSortActive(a,b){
  var ao=isOverdue(a),bo=isOverdue(b);if(ao!==bo)return ao?-1:1;
  if(a.due&&b.due)return a.due<b.due?-1:a.due>b.due?1:0;
  if(a.due)return -1;if(b.due)return 1;return (b.id||0)-(a.id||0);
}

// ================= FORMÁTOVÁNÍ =================
function fmt(x){return (Math.round(x*100)/100).toLocaleString("cs-CZ",{minimumFractionDigits:1,maximumFractionDigits:2});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dateCz(d){if(!d)return "";var p=String(d).slice(0,10).split("-");return p.length===3?(+p[2])+". "+(+p[1])+". "+p[0]:String(d);}
function daysTo(iso){var a=String(iso).slice(0,10).split("-"),t=todayISO().split("-");return Math.round((Date.UTC(+a[0],a[1]-1,+a[2])-Date.UTC(+t[0],t[1]-1,+t[2]))/86400000);}
function pl(n,a,b,c){n=Math.abs(n);return n===1?a:(n>=2&&n<=4?b:c);}
function relDue(iso){var d=daysTo(iso);if(d===0)return "dnes";if(d===1)return "zítra";if(d>1)return "za "+d+" "+pl(d,"den","dny","dní");return (-d)+" "+pl(d,"den","dny","dní")+" po termínu";}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function clip(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s;}

// ================= KOMPONENTY =================
function badge(k,t){return '<span class="b '+k+'">'+t+'</span>';}
function meetingBadge(m){return m.status==="open"?badge("amber","Probíhá"):badge("gray","Uzavřená");}
function resBadge(r){return r?badge("green","Schváleno"):badge("red","Neschváleno");}
function taskBadge(st){return st==="overdue"?badge("red","Po termínu"):st==="open"?badge("blue","V řešení"):st==="done"?badge("green","Splněno"):badge("gray","Zrušeno");}
function voteBadge(x){return x==="ANO"?badge("green","ANO"):x==="NE"?badge("red","NE"):badge("gray","Zdržel se");}
function pageHead(title,sub,actions){return '<div class="ph"><div><h1>'+title+'</h1>'+(sub?'<div class="phs">'+sub+'</div>':'')+'</div>'+(actions?'<div class="row">'+actions+'</div>':'')+'</div>';}
function card(title,right,body,cls){return '<div class="card'+(cls?' '+cls:'')+'">'+(title?'<div class="card-h"><h2>'+title+'</h2>'+(right||'')+'</div>':'')+body+'</div>';}
function empty(icon,title,text,actions){return '<div class="empty"><div class="ei">'+icon+'</div><h3>'+title+'</h3>'+(text?'<p>'+text+'</p>':'')+(actions||'')+'</div>';}
function field(label,input,extra){return '<div class="field">'+(label?'<label>'+label+'</label>':'')+input+(extra||'')+'</div>';}
function seg(items,val,fn){return '<div class="seg">'+items.map(function(it){return '<button class="'+(it[0]===val?'on':'')+'" onclick="'+fn+'(\''+it[0]+'\')">'+it[1]+(it[2]!==undefined?'<span class="n">'+it[2]+'</span>':'')+'</button>';}).join("")+'</div>';}
function dateBlock(iso){if(!iso)return '<div class="dt"><b>–</b></div>';var p=String(iso).split("-");return '<div class="dt"><b>'+(+p[2])+'</b><span>'+MON[+p[1]-1]+' '+p[0]+'</span></div>';}
function gv(id){var e=document.getElementById(id);return e?String(e.value==null?"":e.value):"";}
function setErr(id,msg){var e=document.getElementById(id);if(e)e.textContent=msg;}
function toast(msg){var t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.className="show";clearTimeout(toast._t);toast._t=setTimeout(function(){t.className="";},2400);}
function focusEl(id){setTimeout(function(){var e=document.getElementById(id);if(e&&e.focus)e.focus();},40);}
function scrollTop(){try{window.scrollTo(0,0);}catch(e){}}

// ================= NAVIGACE =================
var ui={newMeeting:false,newTask:false,taskTab:"active",taskQ:"",openTask:null,draft:null,usnQ:"",usnRes:"",usnYear:"",voteDetail:{},mtForm:null};

function go(screen){state.screen=screen;ui.openTask=null;ui.draft=null;ui.newMeeting=false;ui.newTask=false;save();render();scrollTop();}
function goTasks(tab){ui.taskTab=tab||"active";go("ukoly");}
function defaultTab(m){return m.status==="open"?(m.current?"hlasovani":"prezence"):"vysledky";}
function openMeeting(id,tab){
  var m=byId(id);if(!m)return;var same=state.viewId===id&&(state.screen==="meeting"||state.screen==="protokol");
  state.viewId=id;state.screen="meeting";state.subtab=tab||(same&&state.subtab?state.subtab:defaultTab(m));
  ui.mtForm=null;ui.openTask=null;ui.draft=null;save();render();scrollTop();
}
function setTab(t){state.subtab=t;ui.openTask=null;ui.draft=null;save();render();scrollTop();}
function openProtokol(){state.screen="protokol";save();render();scrollTop();}
function openTaskGlobal(id){var t=taskById(id);if(!t)return;ui.taskTab=t.status==="open"?"active":t.status;ui.taskQ="";ui.newTask=false;ui.openTask=id;ui.draft=null;state.screen="ukoly";save();render();scrollTop();}

function navHtml(){
  var s=state.screen,act=(s==="meeting"||s==="protokol")?"schuze":s;
  var over=state.tasks.filter(isOverdue).length;
  function a(id,label,extra){return '<a class="'+(act===id?'on':'')+'" onclick="go(\''+id+'\')">'+label+(extra||'')+'</a>';}
  return a("prehled","Přehled")+a("schuze","Schůze")+a("usneseni","Usnesení")+a("ukoly","Úkoly",over?'<span class="cnt" title="Úkoly po termínu">'+over+'</span>':'')+a("nastaveni","Nastavení");
}
function render(){
  normalize();
  document.getElementById("nav").innerHTML=navHtml();
  var s=state.screen,h;
  if(s==="schuze")h=viewSchuze();
  else if(s==="meeting")h=viewMeeting();
  else if(s==="protokol")h=viewProtokol();
  else if(s==="usneseni")h=viewUsneseni();
  else if(s==="ukoly")h=viewUkoly();
  else if(s==="nastaveni")h=viewNastaveni();
  else h=viewPrehled();
  document.getElementById("app").innerHTML=h;
}

// ================= PŘEHLED =================
function kpi(l,v,s,oc,alert){return '<div class="kpi'+(alert?' alert':'')+'" onclick="'+oc+'"><div class="kpi-l">'+l+'</div><div class="kpi-v">'+v+'</div><div class="kpi-s">'+(s||'&nbsp;')+'</div></div>';}
function runBar(m){
  return '<div class="runbar" onclick="openMeeting('+m.id+')"><span class="pulse"></span><div class="grow"><b>Probíhá schůze</b> · '+esc(m.type||"Schůze")+' '+dateCz(m.date)+
    '<div class="meta">Přítomno '+presentUnits(m).length+' z '+m.roster.length+' · '+fmt(pct(m))+' % podílů · '+m.votes.length+' usnesení'+(m.current?' · právě se hlasuje':'')+'</div></div><span class="btn sm">Pokračovat →</span></div>';
}
function viewPrehled(){
  var ms=state.meetings;
  if(!ms.length&&!state.tasks.length)return viewWelcome();
  var run=ms.filter(function(m){return m.status==="open";});
  var usn=allUsn(),appr=usn.filter(function(u){return u.result;}).length;
  var act=state.tasks.filter(function(t){return t.status==="open";});
  var over=act.filter(isOverdue);
  var soon=act.filter(function(t){return !isOverdue(t)&&t.due&&daysTo(t.due)<=14;});
  var last=ms.slice().sort(function(a,b){return (a.date||"")<(b.date||"")?1:-1;})[0];
  var h=run.map(runBar).join("");
  h+=pageHead("Přehled","Aktuální stav schůzí, usnesení a úkolů",'<button class="btn" onclick="startNewMeeting()">+ Nová schůze</button>');
  h+='<div class="kpis">'+
    kpi("Schůze",ms.length,last?"poslední "+dateCz(last.date):"","go('schuze')")+
    kpi("Usnesení",usn.length,appr+" "+pl(appr,"schváleno","schválena","schváleno"),"go('usneseni')")+
    kpi("Úkoly v řešení",act.length,soon.length?soon.length+" s termínem do 14 dnů":"","goTasks('active')")+
    kpi("Úkoly po termínu",over.length,over.length?pl(over.length,"vyžaduje","vyžadují","vyžaduje")+" pozornost":"vše v termínu","goTasks('active')",over.length>0)+'</div>';
  var todo=act.slice().sort(taskSortActive).slice(0,6);
  var colA=card("Co je potřeba udělat",act.length>todo.length||act.length?'<button class="linkbtn" onclick="goTasks(\'active\')">Všechny úkoly →</button>':'',
    todo.length?'<div class="list">'+todo.map(dashTask).join("")+'</div>':empty("✓","Nic k řešení","Žádné otevřené úkoly.",'<button class="btn sec sm" onclick="newTaskGlobal()">+ Nový úkol</button>'));
  var lastU=usn.slice().sort(usnSortDesc).slice(0,6);
  var colB=card("Poslední usnesení",usn.length?'<button class="linkbtn" onclick="go(\'usneseni\')">Všechna usnesení →</button>':'',
    lastU.length?'<div class="list">'+lastU.map(dashUsn).join("")+'</div>':empty("§","Zatím žádná usnesení","Vznikají uzavřením hlasování na schůzi.",""));
  h+='<div class="grid2">'+colA+colB+'</div>';
  h+=backupReminder();
  return h;
}
function dashTask(t){
  var st=taskState(t);
  return '<div class="it click" onclick="openTaskGlobal('+t.id+')"><span class="tbar '+st+'"></span><div class="it-main"><div class="it-t clamp1">'+esc(t.text)+'</div>'+
    '<div class="meta"><span>'+(t.owner?esc(t.owner):'bez odpovědné osoby')+'</span>'+(t.due?'<span class="'+(st==="overdue"?'red':(daysTo(t.due)<=7?'amber':''))+'">'+relDue(t.due)+'</span>':'<span>bez termínu</span>')+'</div></div></div>';
}
function dashUsn(u){
  return '<div class="it click" onclick="openMeeting('+u.mid+',\'vysledky\')"><div class="it-main"><div class="it-t fw5 clamp2">'+esc(u.text||'(bez textu)')+'</div>'+
    '<div class="meta"><span>č. '+u.num+' · '+dateCz(u.date)+'</span></div></div><div class="it-side">'+resBadge(u.result)+'</div></div>';
}
function viewWelcome(){
  var named=state.roster.filter(function(u){return u.owner;}).length;
  function step(n,t,d,a){return '<div class="step"><div class="stepn">'+n+'</div><div class="it-main"><div class="it-t">'+t+'</div><div class="muted-s" style="margin:3px 0 10px">'+d+'</div>'+a+'</div></div>';}
  return pageHead("Vítejte","Evidence schůzí, usnesení a úkolů SVJ")+
    card("Jak začít","",'<div class="steps">'+
      step(1,"Zkontrolujte vlastníky a podíly","Jména a podíly podle prohlášení vlastníka. Zatím: "+named+" z "+state.roster.length+" jednotek se jménem, součet podílů "+fmt(rosterSum())+" %.",'<button class="btn sec" onclick="go(\'nastaveni\')">Otevřít nastavení</button>')+
      step(2,"Založte schůzi","Na schůzi zapíšete prezenci, hlasování a úkoly. Aplikace sama počítá usnášeníschopnost a výsledky podle podílů.",'<button class="btn" onclick="startNewMeeting()">+ Nová schůze</button>')+
      step(3,"Po schůzi","Vytiskněte protokol, hlídejte úkoly a stáhněte si zálohu dat.","")+'</div>');
}
function backupReminder(){
  var lb=state.lastBackup,days=lb?-daysTo(String(lb).slice(0,10)):null;
  if(lb&&days<=30)return "";
  return '<div class="callout gray row" style="justify-content:space-between"><span>💾 Data jsou uložená jen v tomto prohlížeči. '+(lb?'Poslední záloha před '+days+' '+pl(days,"dnem","dny","dny")+'.':'Zatím jste nestáhli žádnou zálohu.')+'</span><button class="btn sec sm" onclick="backup()">Stáhnout zálohu</button></div>';
}

// ================= SCHŮZE =================
function byDateDesc(a,b){var x=a.date||"",y=b.date||"";if(x!==y)return x<y?1:-1;return b.id-a.id;}
function meetingItem(m){
  var n=m.votes.length,ap=m.votes.filter(function(v){return v.result;}).length,tN=state.tasks.filter(function(t){return t.meetingId===m.id;}).length;
  return '<div class="it click" onclick="openMeeting('+m.id+')">'+dateBlock(m.date)+
    '<div class="it-main"><div class="it-t">'+esc(m.type||"Schůze")+(m.time?' <span class="muted-n">· '+esc(m.time)+'</span>':'')+'</div>'+
    '<div class="meta"><span>přítomno '+presentUnits(m).length+'/'+m.roster.length+' ('+fmt(pct(m))+' %)</span><span>'+n+' usnesení'+(n?' · '+ap+' schv.':'')+'</span>'+(tN?'<span>'+tN+' '+pl(tN,"úkol","úkoly","úkolů")+'</span>':'')+(m.zapisovatel?'<span>zapisovatel '+esc(m.zapisovatel)+'</span>':'')+'</div></div>'+
    '<div class="it-side">'+meetingBadge(m)+'<span class="chev">›</span></div></div>';
}
function viewSchuze(){
  var run=state.meetings.filter(function(m){return m.status==="open";}).sort(byDateDesc);
  var done=state.meetings.filter(function(m){return m.status==="closed";}).sort(byDateDesc);
  var h=pageHead("Schůze","Prezence, hlasování a výsledky jednotlivých schůzí",ui.newMeeting?'':'<button class="btn" onclick="startNewMeeting()">+ Nová schůze</button>');
  if(ui.newMeeting)h+=newMeetingForm();
  if(!state.meetings.length){
    if(!ui.newMeeting)h+=card("","",empty("🗓","Zatím žádná schůze","Založte první schůzi. Převezme aktuální seznam vlastníků a podílů z Nastavení.",'<button class="btn" onclick="startNewMeeting()">+ Nová schůze</button>'));
    return h;
  }
  if(run.length)h+=card("Probíhá","",'<div class="list">'+run.map(meetingItem).join("")+'</div>');
  h+=card("Proběhlé schůze",done.length?'<span class="muted-s">'+done.length+'</span>':'',done.length?'<div class="list">'+done.map(meetingItem).join("")+'</div>':'<div class="card-b muted-s">Zatím žádná ukončená schůze.</div>');
  return h;
}
function startNewMeeting(){state.screen="schuze";ui.newMeeting=true;ui.openTask=null;save();render();scrollTop();focusEl("nmZap");}
function newMeetingForm(){
  var sum=rosterSum(),ok=Math.abs(sum-100)<0.05,d=new Date();
  return card("Nová schůze","",'<div class="card-b">'+
    '<div class="fields">'+field("Datum",'<input type="date" id="nmDate" value="'+todayISO()+'">')+field("Čas",'<input type="time" id="nmTime" value="'+pad(d.getHours())+':'+pad(d.getMinutes())+'">')+'</div>'+
    '<div class="fields">'+field("Typ schůze",'<select id="nmType">'+MTYPES.map(function(t){return '<option>'+t+'</option>';}).join("")+'</select>')+field("Zapisovatel",'<input type="text" id="nmZap" placeholder="jméno zapisovatele">')+'</div>'+
    (ok?'<div class="muted-s mb">Schůze převezme seznam '+state.roster.length+' jednotek a podílů z Nastavení.</div>'
       :'<div class="callout">⚠ Součet podílů v Nastavení je '+fmt(sum)+' % (má být 100 %) — výsledky hlasování by nebyly správné. <button class="linkbtn" onclick="go(\'nastaveni\')">Opravit v Nastavení</button></div>')+
    '<div class="err mb" id="nmErr"></div>'+
    '<div class="form-actions"><button class="btn lg" onclick="createMeeting()">▶ Zahájit schůzi</button><button class="btn ghost" onclick="ui.newMeeting=false;render()">Zrušit</button></div></div>','hl');
}
function createMeeting(){
  var date=gv("nmDate");if(!date){setErr("nmErr","Vyplňte datum schůze.");return;}
  var run=state.meetings.filter(function(m){return m.status==="open";});
  if(run.length&&!confirm("Už probíhá jiná schůze ("+dateCz(run[0].date)+"). Opravdu založit další?"))return;
  var m={id:Date.now(),date:date,time:gv("nmTime"),type:gv("nmType")||MTYPES[0],zapisovatel:gv("nmZap").trim(),status:"open",reopened:null,

// ================= DETAIL SCHŮZE =================
function meetingTabs(m){return m.status==="open"?[["prezence","Prezence"],["hlasovani","Hlasování"],["ukoly","Úkoly"],["vysledky","Výsledky"]]:[["vysledky","Výsledky"],["prezence","Prezence"],["ukoly","Úkoly"]];}
function statusStrip(m){
  var q=isQuorate(m);

    '<span><b>'+fmt(pct(m))+' %</b> podílů <span class="muted-n">· potřeba víc než 50 %</span></span>'+
    '<span>Usnesení <b>'+m.votes.length+'</b></span></div>';
}
function viewMeeting(){
  var m=M();if(!m)return viewSchuze();
  var open=m.status==="open",tabs=meetingTabs(m),tab=state.subtab;
  if(!tabs.some(function(t){return t[0]===tab;}))tab=tabs[0][0];
  state.subtab=tab;
  var tN=state.tasks.filter(function(t){return t.meetingId===m.id;}).length;
  var acts=open?'<button class="btn sec" onclick="openProtokol()">🖨 Protokol</button><button class="btn dangerline" onclick="endMeeting()">Ukončit schůzi</button>'
               :'<button class="btn" onclick="openProtokol()">🖨 Protokol</button><button class="btn ghost" onclick="reopenMeeting()">Odemknout pro opravu</button>';
  if(!m.votes.length&&!m.current)acts+='<button class="btn ghost" onclick="deleteMeeting()">Smazat</button>';
  var h='<span class="crumb" onclick="go(\'schuze\')">← Všechny schůze</span>'+
    '<div class="ph"><div><h1>'+esc(m.type||"Schůze")+' '+meetingBadge(m)+'</h1><div class="phs">'+dateCz(m.date)+(m.time?' · '+esc(m.time):'')+(m.zapisovatel?' · zapisovatel '+esc(m.zapisovatel):'')+'</div></div><div class="row">'+acts+'</div></div>';
  h+=statusStrip(m);
  if(m.reopened)h+='<div class="callout">Schůze byla po ukončení odemčena pro opravu ('+esc(m.reopened)+'). V protokolu je to uvedeno.</div>';
  h+='<div class="tabs">'+tabs.map(function(t){
    var ex="";
    if(t[0]==="prezence")ex='<span class="n">'+presentUnits(m).length+'/'+m.roster.length+'</span>';
    if(t[0]==="hlasovani"&&m.current)ex='<span class="n live">● probíhá</span>';
    if(t[0]==="ukoly"&&tN)ex='<span class="n">'+tN+'</span>';
    return '<button class="'+(t[0]===tab?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+ex+'</button>';}).join("")+'</div>';
  h+=tab==="prezence"?tabPrezence(m):tab==="hlasovani"?tabHlasovani(m):tab==="ukoly"?tabUkoly(m):tabVysledky(m);
  return h;
}

// --- prezence ---
function tabPrezence(m){
  var ro=m.status!=="open";
  var rows=m.roster.map(function(u){var a=m.att[u.id]||{};
    return '<tr class="'+(a.present?'pres-on':'')+'"><td class="c-unit">'+esc(u.unit)+'</td><td>'+(u.owner?esc(u.owner):'<span class="muted-n">byt '+esc(u.unit)+'</span>')+'</td><td class="num">'+fmt(u.podil)+' %</td>'+
      '<td>'+(ro?(a.present?badge("green","Přítomen"):'<span class="muted-n">nepřítomen</span>'):'<button class="tog'+(a.present?' on':'')+'" onclick="togglePresent('+u.id+')">'+(a.present?'✓ Přítomen':'Nepřítomen')+'</button>')+'</td>'+

  var h=card("Prezenční listina",right,'<div class="tablewrap"><table><thead><tr><th>Jedn.</th><th>Vlastník</th><th class="num">Podíl</th><th>Účast</th><th>Plná moc / poznámka</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
  if(!ro)h+='<div class="nextbar"><span class="muted-s">Prezence zapsaná?</span><button class="btn" onclick="setTab(\'hlasovani\')">Pokračovat na hlasování →</button></div>';

}
function togglePresent(id){var m=M();if(!m||m.status!=="open")return;m.att[id].present=!m.att[id].present;save();render();}

function tabHlasovani(m){

  var opts=Object.keys(TYPES).map(function(k){return '<option value="'+k+'">'+TYPES[k].label+'</option>';}).join("");
  var warn=!n?'<div class="callout">Nejdřív v <button class="linkbtn" onclick="setTab(\'prezence\')">prezenci</button> označte přítomné — hlasují jen přítomní.</div>'
    :(!q?'<div class="callout">⚠ Schůze teď není usnášeníschopná ('+fmt(pct(m))+' % podílů). Přijaté usnesení nemusí být platné.</div>':'');
  var h=card("Nové hlasování",'<span class="muted-s">usnesení č. '+(m.votes.length+1)+'</span>','<div class="card-b">'+warn+

    '<div class="mb"></div>'+

    '<div class="form-actions" style="margin-top:14px"><button class="btn lg"'+(n?'':' disabled')+' onclick="startVote()">▶ Zahájit hlasování</button></div></div>');
  if(m.votes.length)h+=card("Proběhlá hlasování",'<button class="linkbtn" onclick="setTab(\'vysledky\')">Výsledky →</button>','<div class="list">'+m.votes.slice().reverse().map(function(v){
    return '<div class="it"><div class="num-c">'+v.num+'</div><div class="it-main"><div class="it-t fw5 clamp2">'+esc(v.text||'(bez textu)')+'</div></div><div class="it-side">'+resBadge(v.result)+'<button class="btn ghost sm" onclick="taskFromVote('+v.num+')">+ Úkol</button></div></div>';}).join("")+'</div>');
  return h;
}
function startVote(){

  presentUnits(m).forEach(function(u){m.current.ballots[u.id]="ZDR";});
  save();render();scrollTop();
}
function liveVote(m){
  var v=m.current,t=tally(m,v),T=t.T;
  var need=(T.op===">"?"více než ":"alespoň ")+fmt(T.thr*100)+" %";
  var share=t.base>0?t.ano/t.base*100:0,baseTxt=T.base==="all"?"všech vlastníků":"přítomných";

      ["ANO","NE","ZDR"].map(function(x){return '<button class="vb '+x.toLowerCase()+(b===x?' sel':'')+'" onclick="cast('+u.id+',\''+x+'\')">'+(x==="ZDR"?"Zdržel se":x)+'</button>';}).join("")+'</div></td></tr>';}).join("");
  return '<div class="card"><div class="card-b"><div class="muted-s">Probíhá hlasování · usnesení č. '+(m.votes.length+1)+'</div><div class="vote-text">'+esc(v.text)+'</div><div class="muted-s">'+esc(T.label)+'</div></div></div>'+
    '<div class="live '+(t.passed?'ok':'no')+'"><div class="big">'+(t.passed?'✓ Usnesení by bylo přijato':'✕ Usnesení by nebylo přijato')+'</div>'+

    card("Hlasy přítomných",'<div class="row"><span class="muted-s">Nastavit všem:</span><button class="btn sec sm" onclick="setAllVotes(\'ANO\')">ANO</button><button class="btn sec sm" onclick="setAllVotes(\'NE\')">NE</button><button class="btn sec sm" onclick="setAllVotes(\'ZDR\')">Zdržel se</button></div>',
      '<div class="tablewrap"><table><thead><tr><th>Jedn.</th><th>Vlastník</th><th class="num">Podíl</th><th>Hlas</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+
    '<div class="nextbar"><button class="btn ghost" onclick="cancelVote()">Zrušit hlasování</button><button class="btn ok lg" onclick="closeVote()">✔ Uzavřít hlasování</button></div>';
}
function cast(id,x){var m=M();if(!m||!m.current)return;m.current.ballots[id]=x;save();render();}
function setAllVotes(x){var m=M();if(!m||!m.current)return;presentUnits(m).forEach(function(u){m.current.ballots[u.id]=x;});save();render();}
function cancelVote(){var m=M();if(!m||!m.current)return;if(!confirm("Zrušit toto hlasování? Nic se neuloží."))return;m.current=null;save();render();}
function closeVote(){
  var m=M();if(!m||!m.current)return;

  m.votes.push({num:num,text:v.text,type:v.type,time:new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"}),ballots:Object.assign({},v.ballots),result:t.passed,

  m.current=null;save();toast("Usnesení č. "+num+" uloženo – "+(t.passed?"schváleno":"neschváleno"));render();scrollTop();
}

// --- výsledky ---
function tabVysledky(m){

    tl+'<div class="usn-actions"><button class="linkbtn" onclick="taskFromVote('+v.num+')">+ Úkol z usnesení</button><button class="linkbtn" onclick="toggleVoteDetail(\''+key+'\')">'+(open?'Skrýt hlasy jednotek':'Hlasy jednotek')+'</button></div>'+det+'</div></div>';

// ================= PROTOKOL =================

function protoSimple(m){

  return protoSecs(m,[["Prezence",'<p>Přítomno '+pres.length+' z '+m.roster.length+' jednotek, '+fmt(tot>0?pp/tot*100:0)+' % vlastnických podílů — schůze <b>'+(q?'byla usnášeníschopná':'nebyla usnášeníschopná')+'</b>.</p>'+presTable],["Přehled usnesení a výsledky hlasování",usn]]);
}
function protoFull(m){
  var pp=presentPodil(m),tot=totalPodil(m),q=isQuorate(m);
  var presRows=m.roster.map(function(u){var a=m.att[u.id]||{};return '<tr><td>'+esc(u.unit)+'</td><td>'+(esc(u.owner)||'byt '+esc(u.unit))+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td><td>'+(a.present?'Přítomen':'—')+'</td><td>'+esc(a.note||'')+'</td></tr>';}).join("");
  var presTot='<tr style="background:#f0f0f0"><td colspan="2"><b>Přítomno celkem</b></td><td style="text-align:right"><b>'+fmt(tot>0?pp/tot*100:0)+' %</b></td><td colspan="2"><b>'+presentUnits(m).length+' / '+m.roster.length+' jednotek</b></td></tr>';
  var summ=m.votes.length?'<table><thead><tr><th>Č.</th><th>Výsledek</th><th>Znění usnesení</th></tr></thead><tbody>'+m.votes.map(function(v){return '<tr><td>'+v.num+'</td><td><b class="'+(v.result?'grn':'rd')+'">'+(v.result?'PŘIJATO':'NEPŘIJATO')+'</b></td><td>'+esc(v.text||'(bez textu)')+'</td></tr>';}).join('')+'</tbody></table>':'<p>Na schůzi nebylo hlasováno o žádném usnesení.</p>';
  var det=m.votes.map(function(v){var s=v.snap;
    return '<div class="usn keep"><h3>Usnesení č. '+v.num+'</h3><p>'+esc(v.text||'(bez textu)')+'</p><p style="font-size:.8rem;color:#555">Potřebná většina: '+esc(s.typeLabel)+(v.time?' · čas hlasování: '+esc(v.time):'')+'</p>'+
      '<p class="rbig '+(v.result?'grn':'rd')+'">'+(v.result?'USNESENÍ PŘIJATO':'USNESENÍ NEBYLO PŘIJATO')+'</p><p>ANO: '+s.cA+' ('+fmt(s.ano)+' % podílů) &nbsp; NE: '+s.cN+' ('+fmt(s.ne)+' %) &nbsp; ZDRŽEL SE: '+s.cZ+' ('+fmt(s.zdr)+' %)</p>'+
      '<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th>Podíl</th><th>Hlas</th></tr></thead><tbody>'+s.units.map(function(u){return '<tr><td>'+esc(u.unit)+'</td><td>'+(esc(u.owner)||'byt '+esc(u.unit))+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td><td>'+protoVote(u.vote)+'</td></tr>';}).join('')+'</tbody></table></div>';}).join('');
  return protoSecs(m,[
    ["Účast a usnášeníschopnost",'<p>Na schůzi bylo přítomno '+presentUnits(m).length+' z '+m.roster.length+' bytových jednotek, představujících '+fmt(tot>0?pp/tot*100:0)+' % vlastnických podílů. Schůze <b>'+(q?'byla usnášeníschopná':'nebyla usnášeníschopná')+'</b> (usnášeníschopnost vyžaduje přítomnost více než 50 % vlastnických podílů).</p>'+
      '<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th>Podíl</th><th>Účast</th><th>Zastoupení / pozn.</th></tr></thead><tbody>'+presRows+presTot+'</tbody></table>'],
    ["Přehled projednaných usnesení",summ],
    ["Jednotlivá usnesení a výsledky hlasování",det||'<p>Bez hlasování.</p>']]);
}

// ================= UKONČENÍ / ODEMČENÍ / SMAZÁNÍ =================
function endMeeting(){
  var m=M();if(!m)return;
  if(m.current){alert("Nejdřív uzavřete nebo zrušte probíhající hlasování.");setTab("hlasovani");return;}
  if(!confirm("Ukončit schůzi?\n\nPrezence a výsledky se uzamknou. Později je lze odemknout pro opravu (v protokolu to bude uvedeno)."))return;
  m.status="closed";state.subtab="vysledky";save();toast("Schůze ukončena");render();scrollTop();
}
function reopenMeeting(){
  var m=M();if(!m)return;
  if(!confirm("Odemknout schůzi pro opravu?\n\nV protokolu bude uvedeno, že byl dodatečně upraven."))return;
  m.status="open";m.reopened=new Date().toLocaleString("cs-CZ");save();toast("Schůze odemčena pro opravu");render();
}
function deleteMeeting(){
  var m=M();if(!m||m.votes.length||m.current)return;
  if(!confirm("Smazat tuto schůzi? Neproběhlo na ní žádné hlasování."))return;
  state.tasks.forEach(function(t){if(t.meetingId===m.id){t.meetingId=null;t.voteNum=null;if(t.source==="usneseni")t.source="jine";}});
  state.meetings=state.meetings.filter(function(x){return x.id!==m.id;});state.viewId=null;toast("Schůze smazána");go("schuze");
}

// ================= USNESENÍ =================
function usnFiltered(){
  var q=norm(ui.usnQ).trim();
  return allUsn().filter(function(u){
    if(ui.usnRes==="ano"&&!u.result)return false;
    if(ui.usnRes==="ne"&&u.result)return false;
    if(ui.usnYear&&u.date.slice(0,4)!==ui.usnYear)return false;
    if(q&&norm(u.text).indexOf(q)<0)return false;
    return true;});
}
function viewUsneseni(){
  var all=allUsn();
  var h=pageHead("Usnesení","Všechna rozhodnutí shromáždění, seřazená podle schůzí",all.length?'<button class="btn sec" onclick="printUsn()">🖨 Tisk / PDF</button>':'');
  if(!all.length)return h+card("","",empty("§","Zatím žádná usnesení","Usnesení vznikají uzavřením hlasování na schůzi.",'<button class="btn sec" onclick="go(\'schuze\')">Přejít na schůze</button>'));
  var nA=all.filter(function(u){return u.result;}).length;
  var years=[];all.forEach(function(u){var y=u.date.slice(0,4);if(y&&years.indexOf(y)<0)years.push(y);});years.sort().reverse();
  h+='<div class="toolbar">'+seg([["","Vše",all.length],["ano","Schválená",nA],["ne","Neschválená",all.length-nA]],ui.usnRes,"setUsnRes")+
    (years.length>1?'<select class="sel-auto" onchange="ui.usnYear=this.value;refreshUsnList()"><option value="">Všechny roky</option>'+years.map(function(y){return '<option'+(ui.usnYear===y?' selected':'')+'>'+y+'</option>';}).join("")+'</select>':'')+
    '<input type="search" class="search" placeholder="Hledat v textu usnesení…" value="'+esc(ui.usnQ)+'" oninput="ui.usnQ=this.value;refreshUsnList()"></div>';
  return h+'<div id="usnList">'+usnListHtml()+'</div><div id="usnprint"></div>';
}
function setUsnRes(v){ui.usnRes=v;render();}
function refreshUsnList(){var e=document.getElementById("usnList");if(e)e.innerHTML=usnListHtml();}
function clearUsnFilters(){ui.usnQ="";ui.usnRes="";ui.usnYear="";render();}
function usnListHtml(){
  var list=usnFiltered().sort(usnSortDesc);
  if(!list.length)return card("","",empty("🔍","Nic nenalezeno","Žádné usnesení neodpovídá filtru.",'<button class="btn sec" onclick="clearUsnFilters()">Zrušit filtry</button>'));
  var groups=[],idx={};
  list.forEach(function(u){if(!idx[u.mid]){idx[u.mid]={m:u.m,items:[]};groups.push(idx[u.mid]);}idx[u.mid].items.push(u);});
  return '<div class="muted-s mb">'+list.length+' usnesení</div>'+groups.map(function(g){
    g.items.sort(function(a,b){return a.num-b.num;});var m=g.m;
    return card('<span class="lnk-h" onclick="openMeeting('+m.id+',\'vysledky\')">'+esc(m.type||"Schůze")+' · '+dateCz(m.date)+'</span>',m.status==="open"?meetingBadge(m):'',
      '<div class="list">'+g.items.map(function(u){var tN=tasksOfVote(u.mid,u.num).length;
        return '<div class="it click" onclick="openMeeting('+u.mid+',\'vysledky\')"><div class="num-c">'+u.num+'</div><div class="it-main"><div class="it-t fw5">'+esc(u.text||'(bez textu)')+'</div>'+
          (tN?'<div class="meta"><span>'+tN+' '+pl(tN,"úkol","úkoly","úkolů")+'</span></div>':'')+'</div><div class="it-side">'+resBadge(u.result)+'</div></div>';}).join("")+'</div>');}).join("");
}
function printUsn(){var p=document.getElementById("usnprint");if(p)p.innerHTML=buildUsnPrint(usnFiltered().sort(usnSortDesc));window.print();}
function buildUsnPrint(list){
  var f=[];if(ui.usnQ)f.push('hledání „'+esc(ui.usnQ)+'“');if(ui.usnYear)f.push('rok '+ui.usnYear);if(ui.usnRes)f.push(ui.usnRes==="ano"?'jen schválená':'jen neschválená');
  return '<h1>Přehled usnesení SVJ</h1><p style="text-align:center;margin:0">Společenství vlastníků jednotek v domě č.p. 2553 a 2554, Praha 3</p>'+
    '<p style="text-align:center;font-size:9pt;color:#444;margin:2px 0 0">'+list.length+' usnesení'+(f.length?' · '+f.join(', '):'')+' · vygenerováno '+new Date().toLocaleString('cs-CZ')+'</p>'+
    '<table><thead><tr><th>Datum schůze</th><th>Č.</th><th>Znění usnesení</th><th>Výsledek</th></tr></thead><tbody>'+
    list.map(function(u){return '<tr><td>'+dateCz(u.date)+'</td><td style="text-align:center">'+u.num+'</td><td>'+esc(u.text)+'</td><td><b>'+(u.result?'Schváleno':'Neschváleno')+'</b></td></tr>';}).join("")+'</tbody></table>';
}

// ================= ÚKOLY =================
function taskForm(m){
  var vn=(m&&ui.mtForm)?ui.mtForm.voteNum:null,v=vn?m.votes.filter(function(x){return x.num===vn;})[0]:null;
  var srcSel='<select id="tSrc">'+["podnet","zakon","jine"].map(function(k){return '<option value="'+k+'"'+(k==="jine"?' selected':'')+'>'+SRC[k]+'</option>';}).join("")+'</select>';
  return (v?'<div class="callout info">Úkol k usnesení č. '+v.num+': <i>'+esc(clip(v.text,220))+'</i></div>':'')+
    field("Co je potřeba udělat",'<textarea id="tText" rows="3" placeholder="Popis úkolu"></textarea>','<div class="err" id="tErr"></div>')+
    '<div class="fields" style="margin-top:12px">'+(v?'':field("Zdroj",srcSel))+field("Odpovídá",'<input type="text" id="tOwner" placeholder="jméno">')+field("Termín",'<input type="date" id="tDue">')+'</div>'+
    field('Poznámka <span class="muted-n">(nepovinné)</span>','<input type="text" id="tNote">')+
    '<div class="form-actions" style="margin-top:14px"><button class="btn" onclick="saveNewTask('+(m?m.id:0)+')">Přidat úkol</button><button class="btn ghost" onclick="closeTaskForm()">Zrušit</button></div>';
}
function closeTaskForm(){ui.mtForm=null;ui.newTask=false;render();}
function saveNewTask(mid){
  var text=gv("tText").trim();
  if(!text){setErr("tErr","Napište, co je potřeba udělat.");focusEl("tText");return;}
  var vn=(mid&&ui.mtForm)?ui.mtForm.voteNum:null;
  state.tasks.push({id:Date.now(),text:text,source:vn?"usneseni":(gv("tSrc")||"jine"),owner:gv("tOwner").trim(),due:gv("tDue"),note:gv("tNote").trim(),
    status:"open",created:todayISO(),meetingId:mid||null,voteNum:vn||null});
  ui.mtForm=null;ui.newTask=false;save();toast("Úkol přidán");render();
}
function taskItem(t,inMeeting){
  var st=taskState(t),open=ui.openTask===t.id,m=t.meetingId?byId(t.meetingId):null,src;
  if(t.source==="usneseni"&&m&&t.voteNum)src=inMeeting?'Usnesení č. '+t.voteNum:'<span class="lnk" onclick="event.stopPropagation();openMeeting('+m.id+',\'vysledky\')">Usnesení č. '+t.voteNum+' · '+dateCz(m.date)+'</span>';
  else src=SRC[t.source]||"Jiné";
  var live=st==="open"||st==="overdue";
  var due=t.due?'<span class="'+(st==="overdue"?'red':(live&&daysTo(t.due)<=7?'amber':''))+'">'+dateCz(t.due)+(live?' · '+relDue(t.due):'')+'</span>':'<span>bez termínu</span>';
  return '<div class="task'+(open?' is-open':'')+'"><div class="it click" onclick="toggleTask('+t.id+')"><span class="tbar '+st+'"></span>'+
    '<div class="it-main"><div class="it-t'+(live?'':' done-t')+'">'+esc(t.text)+'</div>'+
    '<div class="meta"><span>'+(t.owner?esc(t.owner):'<i>bez odpovědné osoby</i>')+'</span>'+due+'<span>'+src+'</span></div>'+
    (t.note&&!open?'<div class="note-l">📝 '+esc(t.note)+'</div>':'')+'</div>'+
    '<div class="it-side">'+taskBadge(st)+'<span class="chev">'+(open?'▾':'›')+'</span></div></div>'+(open?taskDetail(t,m):'')+'</div>';
}
function taskDetail(t,m){
  var v=voteOf(t);
  var info='<dl class="kv">'+
    (v?'':'<dt>Zdroj</dt><dd>'+(SRC[t.source]||"Jiné")+'</dd>')+
    (m?'<dt>Schůze</dt><dd><span class="lnk" onclick="openMeeting('+m.id+',\'vysledky\')">'+esc(m.type||"Schůze")+' · '+dateCz(m.date)+'</span></dd>':'')+
    (v?'<dt>Usnesení č. '+v.num+'</dt><dd><div class="quote">'+esc(v.text)+'</div>'+resBadge(v.result)+'</dd>':'')+
    '<dt>Založeno</dt><dd>'+(t.created?dateCz(t.created):'—')+(t.doneAt?' · splněno '+dateCz(t.doneAt):'')+'</dd></dl>';
  if(t.status==="done")return '<div class="detail">'+info+(t.note?'<div class="mb"><b>Poznámka:</b> '+esc(t.note)+'</div>':'')+'<div class="muted-s">🔒 Splněný úkol je uzamčený.</div></div>';
  if(!ui.draft||ui.draft.id!==t.id)ui.draft={id:t.id,status:t.status,note:t.note||""};
  var d=ui.draft;
  return '<div class="detail">'+info+
    field("Stav",seg([["open","V řešení"],["done","Splněno"],["cancelled","Zrušeno"]],d.status,"setDraftStatus"))+'<div class="mb"></div>'+
    field("Poznámka",'<textarea id="dNote" rows="2" placeholder="např. vyřešeno – stálo 12 000 Kč / zjistili jsme, že…" oninput="ui.draft.note=this.value">'+esc(d.note)+'</textarea>')+
    (d.status==="done"?'<div class="muted-s" style="margin-top:6px">Po uložení jako „Splněno" se úkol uzamkne.</div>':'')+
    '<div class="form-actions" style="margin-top:12px"><button class="btn" onclick="saveTask('+t.id+')">Uložit</button><button class="btn ghost" onclick="toggleTask('+t.id+')">Zavřít</button><span class="grow"></span><button class="linkbtn red" onclick="deleteTask('+t.id+')">Smazat úkol</button></div></div>';
}
function toggleTask(id){ui.openTask=ui.openTask===id?null:id;ui.draft=null;render();}
function setDraftStatus(s){if(ui.draft){ui.draft.status=s;render();}}
function saveTask(id){
  var t=taskById(id);if(!t||!ui.draft||t.status==="done")return;
  var was=t.status;t.status=ui.draft.status;t.note=(ui.draft.note||"").trim();
  if(t.status==="done"&&was!=="done")t.doneAt=todayISO();
  ui.openTask=null;ui.draft=null;save();toast(t.status==="done"?"Úkol splněn ✓":t.status==="cancelled"?"Úkol zrušen":"Úkol uložen");render();
}
function deleteTask(id){if(!confirm("Smazat úkol? Tuto akci nelze vrátit."))return;state.tasks=state.tasks.filter(function(t){return t.id!==id;});ui.openTask=null;ui.draft=null;save();toast("Úkol smazán");render();}
function newTaskGlobal(){state.screen="ukoly";ui.newTask=true;ui.openTask=null;ui.draft=null;ui.taskTab="active";save();render();scrollTop();focusEl("tText");}
function setTaskTab(v){ui.taskTab=v;ui.openTask=null;ui.draft=null;render();}
function refreshTaskList(){var e=document.getElementById("taskList");if(e)e.innerHTML=taskListHtml();}
function clearTaskQ(){ui.taskQ="";render();}
function taskMatches(t,q){var m=t.meetingId?byId(t.meetingId):null,v=voteOf(t);return norm([t.text,t.owner,t.note,SRC[t.source],m?dateCz(m.date):"",v?v.text:""].join(" ")).indexOf(q)>=0;}
function viewUkoly(){
  var c={active:0,done:0,cancelled:0};state.tasks.forEach(function(t){c[t.status==="open"?"active":t.status]++;});
  var h=pageHead("Úkoly","Co je potřeba udělat — z usnesení, podnětů vlastníků i zákonných povinností",ui.newTask?'':'<button class="btn" onclick="newTaskGlobal()">+ Nový úkol</button>');
  if(ui.newTask)h+=card("Nový úkol","",'<div class="card-b">'+taskForm(null)+'</div>','hl');
  if(!state.tasks.length){
    if(!ui.newTask)h+=card("","",empty("☐","Zatím žádné úkoly","Úkoly vznikají na schůzi (i z konkrétního usnesení), nebo je přidáte tady — třeba podnět vlastníka nebo zákonnou povinnost.",'<button class="btn" onclick="newTaskGlobal()">+ Nový úkol</button>'));
    return h;
  }
  h+='<div class="toolbar">'+seg([["active","Aktivní",c.active],["done","Splněné",c.done],["cancelled","Zrušené",c.cancelled]],ui.taskTab,"setTaskTab")+
    '<input type="search" class="search" placeholder="Hledat úkol, osobu, poznámku…" value="'+esc(ui.taskQ)+'" oninput="ui.taskQ=this.value;refreshTaskList()"></div>';
  return h+'<div id="taskList">'+taskListHtml()+'</div>';
}
function taskListHtml(){
  var q=norm(ui.taskQ).trim(),tab=ui.taskTab;
  var list=state.tasks.filter(function(t){return tab==="active"?t.status==="open":t.status===tab;}).filter(function(t){return !q||taskMatches(t,q);});
  if(!list.length){
    if(q)return card("","",empty("🔍","Nic nenalezeno","Žádný úkol neodpovídá hledání „"+esc(ui.taskQ)+"“.",'<button class="btn sec" onclick="clearTaskQ()">Zrušit hledání</button>'));
    return card("","",tab==="active"?empty("✓","Žádné aktivní úkoly","Vše je vyřešeno. Nový úkol přidáte tlačítkem nahoře nebo přímo na schůzi.",""):empty("—",tab==="done"?"Zatím žádné splněné úkoly":"Žádné zrušené úkoly","",""));
  }
  if(tab!=="active"){
    list.sort(function(a,b){var x=a.doneAt||a.created||"",y=b.doneAt||b.created||"";return x<y?1:x>y?-1:b.id-a.id;});
    return card("","",'<div class="list">'+list.map(function(t){return taskItem(t,false);}).join("")+'</div>');
  }
  var g={over:[],soon:[],later:[],none:[]};
  list.forEach(function(t){if(!t.due)g.none.push(t);else{var d=daysTo(t.due);if(d<0)g.over.push(t);else if(d<=14)g.soon.push(t);else g.later.push(t);}});
  ["over","soon","later"].forEach(function(k){g[k].sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0;});});
  g.none.sort(function(a,b){return b.id-a.id;});
  var groups=[["over","Po termínu","red"],["soon","Termín do 14 dnů",""],["later","Později",""],["none","Bez termínu",""]];
  return card("","",'<div class="list">'+groups.map(function(gr){var it=g[gr[0]];if(!it.length)return "";
    return '<div class="grp '+gr[2]+'">'+gr[1]+'<span>'+it.length+'</span></div>'+it.map(function(t){return taskItem(t,false);}).join("");}).join("")+'</div>');
}

// ================= NASTAVENÍ =================
function sumBadge(s){return Math.abs(s-100)<0.05?badge("green","Součet "+fmt(s)+" %"):badge("red","Součet "+fmt(s)+" % — má být 100 %");}
function viewNastaveni(){
  var rows=state.roster.map(function(u){return '<tr><td style="width:110px"><input type="text" value="'+esc(u.unit)+'" oninput="setR('+u.id+',\'unit\',this.value)"></td>'+
    '<td><input type="text" value="'+esc(u.owner)+'" placeholder="jméno vlastníka" oninput="setR('+u.id+',\'owner\',this.value)"></td>'+
    '<td style="width:150px"><input type="number" step="0.0001" min="0" value="'+(+u.podil||0)+'" oninput="setPodil('+u.id+',this.value)"></td></tr>';}).join("");
  var lb=state.lastBackup;
  return pageHead("Nastavení","Vlastníci, podíly a záloha dat")+
    card("Vlastníci a podíly",'<span id="sumB">'+sumBadge(rosterSum())+'</span>','<div class="card-b" style="padding-bottom:4px"><div class="callout gray">Podíly vyplňte podle prohlášení vlastníka — součet musí být 100 %. Změny se projeví jen u nově založených schůzí; proběhlé schůze mají uložený vlastní snímek.</div></div>'+
      '<div class="tablewrap"><table class="edit"><thead><tr><th>Jednotka</th><th>Vlastník</th><th>Podíl (%)</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+
    card("Záloha dat","",'<div class="card-b"><p class="mb">Všechna data jsou uložená <b>jen v tomto prohlížeči</b>. Po každé schůzi si stáhněte zálohu a uložte ji mimo počítač.</p>'+
      '<p class="muted-s mb">Poslední záloha: '+(lb?dateCz(String(lb).slice(0,10))+(String(lb).length>10?' '+String(lb).slice(11):''):'zatím nikdy')+'</p>'+
      '<div class="form-actions"><button class="btn" onclick="backup()">⬇ Stáhnout zálohu</button><button class="btn sec" onclick="pickRestore()">⬆ Obnovit ze zálohy</button><input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restore(event)"></div>'+
      '<div class="callout" style="margin:14px 0 0">Záloha obsahuje jména vlastníků a podíly (osobní údaje). Neukládejte ji na veřejný web ani GitHub.</div></div>');
}
function setR(id,f,v){var u=state.roster.filter(function(x){return x.id===id;})[0];if(u){u[f]=v;save();}}
function setPodil(id,v){var u=state.roster.filter(function(x){return x.id===id;})[0];if(!u)return;u.podil=parseFloat(String(v).replace(",","."))||0;save();var e=document.getElementById("sumB");if(e)e.innerHTML=sumBadge(rosterSum());}
function download(n,c,t){var b=new Blob([c],{type:t});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}
function backup(){var d=new Date();state.lastBackup=todayISO()+" "+pad(d.getHours())+":"+pad(d.getMinutes());save();download("svj_zaloha_"+todayISO()+".json",JSON.stringify(state,null,2),"application/json");toast("Záloha stažena");render();}
function pickRestore(){var e=document.getElementById("restoreFile");if(e)e.click();}
function restore(ev){
  var f=ev.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{var s=JSON.parse(r.result);if(!s||!Array.isArray(s.meetings)||!Array.isArray(s.roster))throw new Error("format");
      if(!confirm("Obnovit data ze zálohy?\n\nSoučasná data v tomto prohlížeči budou nahrazena obsahem souboru."))return;
      state=s;state.screen="prehled";normalize();save();toast("Data obnovena ze zálohy");render();
    }catch(e){alert("Soubor se nepodařilo načíst. Vyberte zálohu staženou z této aplikace (soubor .json).");}
  };
  r.readAsText(f);ev.target.value="";
}

render();
</script>
