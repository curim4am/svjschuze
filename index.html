<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlasování SVJ — evidence schůzí</title>
<style>
:root{
  --bg:#eef1f6;--card:#fff;--ink:#1c2430;--muted:#6b7480;--line:#dfe3ea;--brand:#1f3864;
  --green:#1e8e3e;--green-bg:#e6f4ea;--red:#c5221f;--red-bg:#fce8e6;--grey:#9aa5b1;--grey-bg:#eceff3;--amber:#b06000;--amber-bg:#fff4e0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;color:var(--brand)} h2{color:var(--brand);font-size:1.05rem;margin:6px 0}
.sub{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tab{padding:11px 18px;border:none;border-radius:10px;background:#dbe1ec;color:var(--brand);font-weight:700;font-size:1rem;cursor:pointer}
.tab.active{background:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.banner{border-radius:12px;padding:16px 18px;font-weight:800;font-size:1.35rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner small{display:block;font-weight:600;font-size:.95rem;margin-top:4px}
.ok{background:var(--green-bg);color:var(--green)}.no{background:var(--red-bg);color:var(--red)}.wait{background:var(--amber-bg);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
td.num,th.num{text-align:right}
th{background:#f2f5fa;color:var(--brand);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:#f5f8fd}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
textarea{min-height:60px;resize:vertical}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:#dbe1ec;color:var(--brand)} .btn.big{padding:14px 22px;font-size:1.1rem}
.btn.danger{background:var(--red)} .btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}
.vote-btns{display:flex;gap:6px}
.vb{flex:1;text-align:center;padding:12px 6px;border-radius:9px;font-weight:800;cursor:pointer;border:2px solid var(--line);background:#f7f9fc;color:#555;min-width:64px}
.vb.ano.sel{background:var(--green);color:#fff;border-color:var(--green)}
.vb.ne.sel{background:var(--red);color:#fff;border-color:var(--red)}
.vb.zdr.sel{background:var(--grey);color:#fff;border-color:var(--grey)}
.pres{padding:10px 16px;border-radius:9px;font-weight:800;cursor:pointer;border:2px solid var(--line);background:#f7f9fc;color:#666;min-width:130px;text-align:center}
.pres.on{background:var(--green);color:#fff;border-color:var(--green)}
tr.unvoted td{background:#fff9e6}
.small{font-size:.85rem;color:var(--muted)}
.note{background:#fff4e0;border:1px solid #f0d9a8;border-radius:10px;padding:10px 12px;font-size:.88rem;color:#7a5200;margin-bottom:12px}
.badge{font-weight:800;padding:2px 8px;border-radius:6px}
.badge.ano{background:var(--green-bg);color:var(--green)}.badge.ne{background:var(--red-bg);color:var(--red)}.badge.zdr{background:var(--grey-bg);color:#555}.badge.none{background:#fff9e6;color:var(--amber)}
.badge.open{background:var(--amber-bg);color:var(--amber)}.badge.closed{background:var(--grey-bg);color:#555}
.hidden{display:none}
.chip{display:inline-block;background:#eef2f9;color:var(--brand);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700}
.locknote{background:var(--grey-bg);border-radius:10px;padding:10px 12px;font-size:.88rem;color:#555;margin-bottom:12px}
.protobar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#protokol{background:#fff;max-width:820px;margin:0 auto;padding:30px 36px;color:#111;border:1px solid var(--line);border-radius:8px;font-size:.9rem}
#protokol h1{font-size:1.3rem;text-align:center;color:#111;margin:0 0 2px}
#protokol .center{text-align:center}
#protokol h2{font-size:1.02rem;border-bottom:2px solid #111;color:#111;margin:20px 0 8px;padding-bottom:3px}
#protokol h3{font-size:.95rem;color:#111;margin:14px 0 4px}
#protokol table{font-size:.8rem;margin:6px 0}
#protokol th,#protokol td{border:1px solid #999;padding:4px 6px}
#protokol .rbig{font-weight:800;padding:6px 0}
#protokol .grn{color:#136c2e}#protokol .rd{color:#a5201d}
#protokol .sig{margin-top:40px;display:flex;gap:40px;flex-wrap:wrap}
#protokol .sig div{flex:1;min-width:200px;border-top:1px solid #111;padding-top:4px;font-size:.8rem}
#protokol .foot{margin-top:24px;font-size:.72rem;color:#666;text-align:right}
.proto-switch{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.proto-switch label{font-weight:700;color:var(--brand);cursor:pointer;display:flex;gap:6px;align-items:center}
.proto-switch input{width:auto;transform:scale(1.2)}
#protokol .usn{margin:12px 0}
#protokol .usn-t{margin:0 0 2px}
.mact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actsep{width:1px;align-self:stretch;min-height:34px;background:var(--line);margin:0 3px}
.btn.end{background:#fff;color:var(--red);border:2px solid var(--red);padding:8px 14px}
.btn.end:hover{background:var(--red);color:#fff}
.brand{text-align:center;color:var(--muted);font-size:.78rem;padding:20px 0 10px;opacity:.8;letter-spacing:.02em}
@page{size:A4;margin:14mm 15mm}
@media print{
  html,body{background:#fff}
  body *{visibility:hidden}
  #protokol,#protokol *{visibility:visible}
  #protokol{position:absolute;left:0;top:0;width:100%;max-width:none;border:none;border-radius:0;margin:0;padding:0;font-size:10.5pt;color:#000}
  .protobar,.proto-switch{display:none!important}
  #protokol h1{font-size:15pt}
  #protokol h2{font-size:12pt;break-after:avoid;page-break-after:avoid}
  #protokol h3{font-size:10.5pt;break-after:avoid;page-break-after:avoid}
  #protokol table{page-break-inside:auto;margin:6px 0}
  #protokol thead{display:table-header-group}
  #protokol tfoot{display:table-footer-group}
  #protokol tr{break-inside:avoid;page-break-inside:avoid}
  #protokol .keep,#protokol .usn,#protokol .sig{break-inside:avoid;page-break-inside:avoid}
  #protokol p{orphans:2;widows:2}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="row spread">
    <div>
      <h1 id="appTitle">Hlasování SVJ — evidence schůzí</h1>
      <div class="sub">Buková 2553 a 2554, Praha 3 · <span id="unitCount"></span> jednotek</div>
    </div>
    <div class="row" id="topActions"></div>
  </div>
  <div id="app"></div>
  <footer class="brand">© 2026 curim4am</footer>
</div>

<script>
// ===== pravidla SVJ =====
var TYPES={
  prosta:{label:"Prostá většina přítomných (> 50 %)",base:"present",thr:0.5,op:">",note:"běžná rozhodnutí"},
  ctvrt:{label:"Tříčtvrtinová většina přítomných (≥ 75 %)",base:"present",thr:0.75,op:">=",note:"stanovy, řády, stavební úpravy, výhradní užívání společných částí"},
  nadpvse:{label:"Nadpoloviční většina VŠECH vlastníků (> 50 %)",base:"all",thr:0.5,op:">",note:"volba výboru"},
  vsichni:{label:"Souhlas VŠECH vlastníků (100 %)",base:"all",thr:1.0,op:">=",note:"změna stavby/účelu, změna podílů"}
};
var QUORUM=0.5;
var MTYPES=["Řádné shromáždění","Náhradní shromáždění","Mimořádné shromáždění","Per rollam"];

function defaultRoster(){var a=[],p=100/24;for(var i=1;i<=24;i++)a.push({id:i,unit:String(i),owner:"",podil:p});return a;}

var state=load();
if(!state){
  var old=null; try{old=JSON.parse(localStorage.getItem("svj_hlas"));}catch(e){}
  state={ roster:(old&&old.units)?old.units.map(u=>({id:u.id,unit:u.unit,owner:u.owner,podil:u.podil})):defaultRoster(),
          meetings:[], viewId:null, screen:"home", subtab:"prezence" };
}
function save(){try{localStorage.setItem("svj_schuze",JSON.stringify(state));}catch(e){}}
function load(){try{var s=localStorage.getItem("svj_schuze");return s?JSON.parse(s):null;}catch(e){return null;}}

// ===== výpočty (na schůzi) =====
function M(){return state.meetings.find(m=>m.id===state.viewId)||null;}
function totalPodil(m){return m.roster.reduce((a,u)=>a+(+u.podil||0),0);}
function presentUnits(m){return m.roster.filter(u=>m.att[u.id]&&m.att[u.id].present);}
function presentPodil(m){return presentUnits(m).reduce((a,u)=>a+(+u.podil||0),0);}
function isQuorate(m){var t=totalPodil(m);return t>0&&presentPodil(m)/t>QUORUM;}
function fmt(x){return (Math.round(x*100)/100).toLocaleString("cs-CZ",{minimumFractionDigits:1,maximumFractionDigits:2});}
function pass(op,a,b){return op===">"?a>b+1e-9:a>=b-1e-9;}
function tally(m,v){
  var tot=totalPodil(m),pres=presentPodil(m),ano=0,ne=0,zdr=0,cA=0,cN=0,cZ=0,un=0;
  presentUnits(m).forEach(function(u){var b=v.ballots[u.id];
    if(b==="ANO"){ano+=+u.podil;cA++;}else if(b==="NE"){ne+=+u.podil;cN++;}else{zdr+=+u.podil;cZ++;}});
  var T=TYPES[v.type],base=T.base==="all"?tot:pres,ratio=base>0?ano/base:0;
  return{ano:ano,ne:ne,zdr:zdr,cA:cA,cN:cN,cZ:cZ,un:un,tot:tot,pres:pres,base:base,ratio:ratio,passed:pass(T.op,ratio,T.thr),T:T};
}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ===== router =====
function go(screen,subtab){state.screen=screen;if(subtab)state.subtab=subtab;save();render();}
function render(){
  document.getElementById("unitCount").textContent=state.roster.length;
  var app=document.getElementById("app"),top=document.getElementById("topActions");top.innerHTML="";
  if(state.screen==="home"){topActions_home();renderHome(app);}
  else if(state.screen==="settings"){top.innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Zpět</button>';renderSettings(app);}
  else if(state.screen==="newmeeting"){top.innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Zpět</button>';renderNewMeeting(app);}
  else if(state.screen==="meeting"){renderMeeting(app);}
}
function topActions_home(){document.getElementById("topActions").innerHTML=
  '<button class="btn ghost" onclick="go(\'settings\')">⚙ Nastavení</button>'+
  '<button class="btn ghost" onclick="backup()">Záloha</button>'+
  '<button class="btn ghost" onclick="document.getElementById(\'restore\').click()">Načíst</button>'+
  '<input id="restore" type="file" accept="application/json" class="hidden" onchange="restore(event)">';}

// ===== HOME / ARCHIV =====
function renderHome(app){
  var rows=state.meetings.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(function(m){
    var q=isQuorate(m),pp=presentPodil(m),tot=totalPodil(m);
    return '<tr class="clickable" onclick="openMeeting('+m.id+')">'+
      '<td>'+dateCz(m.date)+(m.time?' '+m.time:'')+'</td>'+
      '<td>'+escapeHtml(m.type||'')+'</td>'+
      '<td>'+escapeHtml(m.zapisovatel||'')+'</td>'+
      '<td class="num">'+presentUnits(m).length+'/'+m.roster.length+'</td>'+
      '<td class="num">'+fmt(tot>0?pp/tot*100:0)+' %</td>'+
      '<td class="num">'+m.votes.length+'</td>'+
      '<td><span class="badge '+(m.status==="open"?"open":"closed")+'">'+(m.status==="open"?"probíhá":"uzavřená")+'</span></td></tr>';
  }).join("");
  app.innerHTML=
    '<div class="card"><button class="btn big green" onclick="go(\'newmeeting\')">➕ Nová schůze</button></div>'+
    '<div class="card"><h2>Historie schůzí</h2>'+
    (state.meetings.length? '<table><thead><tr><th>Datum</th><th>Typ</th><th>Zapisovatel</th><th class="num">Přítomno</th><th class="num">Podíl</th><th class="num">Hlasování</th><th>Stav</th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<p class="small">Zatím žádná schůze. Založ novou tlačítkem výše.</p>')+'</div>';
}
function dateCz(d){if(!d)return "";var p=d.split("-");return p.length===3?p[2]+". "+p[1]+". "+p[0]:d;}

// ===== NOVÁ SCHŮZE =====
function renderNewMeeting(app){
  var opts=MTYPES.map(t=>'<option>'+t+'</option>').join("");
  app.innerHTML='<div class="card"><h2>Nová schůze</h2>'+
    '<div class="row"><div style="flex:1;min-width:150px"><label class="small">Datum</label><input type="date" id="nDate" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
    '<div style="flex:1;min-width:120px"><label class="small">Čas</label><input type="time" id="nTime"></div></div>'+
    '<div class="row" style="margin-top:10px"><div style="flex:1;min-width:200px"><label class="small">Typ schůze</label><select id="nType">'+opts+'</select></div>'+
    '<div style="flex:1;min-width:200px"><label class="small">Zapisovatel</label><input type="text" id="nZap" placeholder="jméno"></div></div>'+
    '<div class="note" style="margin-top:12px">Schůze převezme aktuální podíly a jména z Nastavení jako svůj snímek. Pozdější úpravy Nastavení už tuto schůzi nezmění.</div>'+
    '<button class="btn big" style="margin-top:6px" onclick="createMeeting()">Vytvořit a přejít na prezenci →</button></div>';
}
function createMeeting(){
  var m={ id:Date.now(), date:val("nDate"), time:val("nTime"), type:val("nType"), zapisovatel:val("nZap"),
    status:"open", reopened:null, roster:state.roster.map(u=>({id:u.id,unit:u.unit,owner:u.owner,podil:+u.podil||0})),
    att:{}, votes:[], current:null };
  m.roster.forEach(u=>m.att[u.id]={present:false,proxy:false,note:""});
  state.meetings.push(m); state.viewId=m.id; state.screen="meeting"; state.subtab="prezence"; save(); render();
}
function val(id){return document.getElementById(id).value;}

// ===== SCHŮZE (prezence / hlasování / přehled) =====
function openMeeting(id){state.viewId=id;state.screen="meeting";state.subtab="prezence";save();render();}
function renderMeeting(app){
  var m=M();if(!m){go("home");return;}
  var ro=m.status!=="open"; // read-only
  document.getElementById("topActions").innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Přehled schůzí</button>';
  var acts = ro
    ? '<button class="btn ghost" onclick="reopenMeeting()">🔓 Odemknout</button>'
    : '<button class="btn end" onclick="endMeeting()">■ Ukončit schůzi</button>';
  var head='<div class="card"><div class="row spread" style="gap:12px">'+
    '<div><h2>Schůze '+dateCz(m.date)+(m.time?' '+m.time:'')+'</h2>'+
    '<div class="small">'+escapeHtml(m.type||'')+' · zapisovatel: '+escapeHtml(m.zapisovatel||'—')+' · <span class="badge '+(ro?"closed":"open")+'">'+(ro?"uzavřená":"probíhá")+'</span></div></div>'+
    '<div class="mact">'+acts+'</div></div></div>';
  if(state.subtab==="protokol"){ app.innerHTML=renderProtokol(m); return; }
  var tabs='<div class="tabs">'+
    tabBtn("prezence","Prezence")+tabBtn("hlasovani","Hlasování")+tabBtn("prehled","Přehled a protokol")+'</div>';
  var body="";
  if(state.subtab==="prezence") body=renderPrezence(m,ro);
  else if(state.subtab==="hlasovani") body=renderHlasovani(m,ro);
  else body=renderPrehled(m,ro);
  app.innerHTML=head+tabs+body;
}
function tabBtn(t,l){return '<button class="tab '+(state.subtab===t?"active":"")+'" onclick="go(\'meeting\',\''+t+'\')">'+l+'</button>';}

function renderPrezence(m,ro){
  var q=isQuorate(m),pp=presentPodil(m),tot=totalPodil(m);
  var banner='<div class="banner '+(q?"ok":"no")+'">'+(q?"🟢 USNÁŠENÍSCHOPNÁ":"🔴 NENÍ USNÁŠENÍSCHOPNÁ")+
    '<small>Přítomno '+presentUnits(m).length+' z '+m.roster.length+' jednotek · '+fmt(tot>0?pp/tot*100:0)+' % vlastnických podílů. (Potřeba: více než 50 % podílů.)</small></div>';
  var rows=m.roster.map(function(u){var a=m.att[u.id]||{};
    return '<tr><td>'+u.unit+'</td><td>'+(escapeHtml(u.owner)||'<span class="small">byt '+u.unit+'</span>')+'</td><td class="num">'+fmt(u.podil)+' %</td>'+
      '<td><div class="pres '+(a.present?"on":"")+'" '+(ro?'':'onclick="togglePresent('+u.id+')"')+'>'+(a.present?"PŘÍTOMEN":"nepřítomen")+'</div></td>'+
      '<td>'+(ro? escapeHtml(a.note||''): '<input type="text" value="'+escapeHtml(a.note||'')+'" placeholder="zmocněnec / plná moc" oninput="setNote('+u.id+',this.value)">')+'</td></tr>';}).join("");
  var ctl=ro?"":'<div class="row"><button class="btn ghost" onclick="setAllPresent(true)">Vše přítomno</button><button class="btn ghost" onclick="setAllPresent(false)">Vynulovat</button></div>';
  return banner+'<div class="card">'+(ro?'<div class="locknote">Schůze je uzavřená (jen ke čtení).</div>':'')+
    '<div class="row spread" style="margin-bottom:10px"><strong>Prezenční listina</strong>'+ctl+'</div>'+
    '<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th class="num">Podíl</th><th>Přítomen</th><th>Plná moc / pozn.</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function togglePresent(id){var m=M();m.att[id].present=!m.att[id].present;save();renderMeeting(document.getElementById("app"));}
function setNote(id,v){M().att[id].note=v;save();}
function setAllPresent(v){var m=M();m.roster.forEach(u=>m.att[u.id].present=v);save();renderMeeting(document.getElementById("app"));}

function renderHlasovani(m,ro){
  if(ro){ // read-only: seznam hlasování schůze
    if(!m.votes.length) return '<div class="card"><p class="small">Na této schůzi neproběhlo žádné hlasování.</p></div>';
    return '<div class="card"><h2>Hlasování schůze</h2>'+voteListHtml(m)+'</div>';
  }
  if(!m.current){
    var opts=Object.keys(TYPES).map(k=>'<option value="'+k+'">'+TYPES[k].label+'</option>').join("");
    return '<div class="card">'+
      '<h2>Nové hlasování č. '+(m.votes.length+1)+'</h2>'+
      '<label class="small">Text usnesení</label><textarea id="voteText" placeholder="Schvaluje shromáždění …"></textarea>'+
      '<div style="margin:10px 0"><label class="small">Typ / potřebná většina</label><select id="voteType">'+opts+'</select></div>'+
      '<button class="btn big" onclick="startVote()">▶ Zahájit hlasování</button></div>'+
      (m.votes.length?'<div class="card"><h2>Dosavadní hlasování</h2>'+voteListHtml(m)+'</div>':'');
  }
  var v=m.current,t=tally(m,v);
  var rows=presentUnits(m).map(function(u){var b=v.ballots[u.id];
    return '<tr class="'+(b?'':'unvoted')+'"><td>'+u.unit+'</td><td>'+(escapeHtml(u.owner)||'byt '+u.unit)+'</td><td class="num">'+fmt(u.podil)+' %</td>'+
      '<td><div class="vote-btns">'+
      '<div class="vb ano '+(b==="ANO"?"sel":"")+'" onclick="cast('+u.id+',\'ANO\')">ANO</div>'+
      '<div class="vb ne '+(b==="NE"?"sel":"")+'" onclick="cast('+u.id+',\'NE\')">NE</div>'+
      '<div class="vb zdr '+(b==="ZDR"?"sel":"")+'" onclick="cast('+u.id+',\'ZDR\')">ZDRŽEL</div></div></td></tr>';}).join("");
  var expl='Pro: '+fmt(t.ano)+' % podílů ('+fmt(t.tot>0?t.ano/t.tot*100:0)+' % všech). Počítáno z '+(t.T.base==="all"?"všech vlastníků":"přítomných")+
    '. Potřebná většina: '+(t.T.op===">"?"více než ":"alespoň ")+fmt(t.T.thr*100)+' % '+(t.T.base==="all"?"všech":"přítomných")+'.';
  return '<div class="card"><div class="small">Probíhající hlasování č. '+(m.votes.length+1)+'</div><h2>'+escapeHtml(v.text||"(bez textu)")+'</h2><div class="small">'+t.T.label+'</div></div>'+
    '<div class="banner '+(t.passed?"ok":"no")+'">'+(t.passed?"🟢 USNESENÍ PŘIJATO":"🔴 USNESENÍ NEBYLO PŘIJATO")+
    '<small>'+expl+(t.un>0?' <b style="color:var(--amber)">⚠ '+t.un+' přítomných zatím nehlasovalo.</b>':'')+'</small></div>'+
    '<div class="card"><div class="row" style="gap:20px;margin-bottom:10px"><div>ANO: <b>'+t.cA+'</b> ('+fmt(t.ano)+' %)</div><div>NE: <b>'+t.cN+'</b> ('+fmt(t.ne)+' %)</div><div>ZDRŽEL: <b>'+t.cZ+'</b> ('+fmt(t.zdr)+' %)</div><div>nehlasovalo: <b>'+t.un+'</b></div></div>'+
    '<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th class="num">Podíl</th><th>Hlas</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="row" style="margin-top:14px"><button class="btn big green" onclick="closeVote()">✔ Uzavřít hlasování</button><button class="btn ghost" onclick="cancelVote()">Zrušit</button></div></div>';
}
function startVote(){var m=M();
  var text=val("voteText").trim(),type=val("voteType");
  if(!text&&!confirm("Text usnesení je prázdný. Přesto zahájit?"))return;
  m.current={text:text,type:type,ballots:{}};
  presentUnits(m).forEach(function(u){m.current.ballots[u.id]="ZDR";});
  save();renderMeeting(document.getElementById("app"));}
function cast(id,x){var m=M();if(!m.current)return;var cur=m.current.ballots[id];m.current.ballots[id]=cur===x?null:x;save();renderMeeting(document.getElementById("app"));}
function cancelVote(){var m=M();if(confirm("Zrušit toto hlasování bez uložení?")){m.current=null;save();renderMeeting(document.getElementById("app"));}}
function closeVote(){var m=M(),v=m.current,t=tally(m,v);
  if(t.un>0&&!confirm(t.un+" přítomných nehlasovalo. Opravdu uzavřít? (nehlasování se nezapočítává jako souhlas)"))return;
  if(!confirm("Uzavřít hlasování jako FINÁLNÍ? Výsledek: "+(t.passed?"PŘIJATO":"NEPŘIJATO")))return;
  m.votes.push({num:m.votes.length+1,text:v.text,type:v.type,time:new Date().toLocaleTimeString("cs-CZ"),
    ballots:Object.assign({},v.ballots),result:t.passed,
    snap:{cA:t.cA,cN:t.cN,cZ:t.cZ,un:t.un,ano:t.ano,ne:t.ne,zdr:t.zdr,tot:t.tot,pres:t.pres,base:t.base,typeLabel:t.T.label,
      units:presentUnits(m).map(u=>({unit:u.unit,owner:u.owner,podil:u.podil,vote:v.ballots[u.id]||"—"}))}});
  m.current=null;save();go("meeting","prehled");}

function voteListHtml(m){
  return m.votes.map(function(v,i){var s=v.snap;
    var det='<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th class="num">Podíl</th><th>Hlas</th></tr></thead><tbody>'+
      s.units.map(u=>'<tr><td>'+u.unit+'</td><td>'+(escapeHtml(u.owner)||'byt '+u.unit)+'</td><td class="num">'+fmt(u.podil)+' %</td><td><span class="badge '+bc(u.vote)+'">'+u.vote+'</span></td></tr>').join("")+'</tbody></table>';
    return '<div class="card" style="border:1px solid var(--line)"><div class="row spread clickable" onclick="var d=document.getElementById(\'d'+i+'\');d.classList.toggle(\'hidden\')">'+
      '<div><b>Hlasování č. '+v.num+' — '+escapeHtml(v.text||"(bez textu)")+'</b><div class="small">'+(v.time||'')+' · '+s.typeLabel+'</div></div>'+
      '<div style="color:'+(v.result?'var(--green)':'var(--red)')+';font-weight:800">'+(v.result?'🟢 PŘIJATO':'🔴 NEPŘIJATO')+'</div></div>'+
      '<div class="small" style="margin-top:6px">ANO '+s.cA+' ('+fmt(s.ano)+' %) · NE '+s.cN+' ('+fmt(s.ne)+' %) · ZDRŽEL '+s.cZ+' ('+fmt(s.zdr)+' %)'+(s.un?' · nehlasovalo '+s.un:'')+'</div>'+
      '<div id="d'+i+'" class="hidden" style="margin-top:10px">'+det+'</div></div>';}).join("");
}
function bc(v){return v==="ANO"?"ano":v==="NE"?"ne":v==="ZDR"?"zdr":"none";}

function renderPrehled(m,ro){
  var q=isQuorate(m),pp=presentPodil(m),tot=totalPodil(m);
  var summary='<div class="card"><h2>Přehled schůze</h2>'+
    '<div class="row" style="gap:24px"><div>Datum: <b>'+dateCz(m.date)+(m.time?' '+m.time:'')+'</b></div><div>Typ: <b>'+escapeHtml(m.type||'')+'</b></div><div>Zapisovatel: <b>'+escapeHtml(m.zapisovatel||'—')+'</b></div></div>'+
    '<div class="row" style="gap:24px;margin-top:8px"><div>Přítomno: <b>'+presentUnits(m).length+'/'+m.roster.length+'</b></div><div>Podíl přítomných: <b>'+fmt(tot>0?pp/tot*100:0)+' %</b></div>'+
    '<div>Usnášeníschopná: <b style="color:'+(q?'var(--green)':'var(--red)')+'">'+(q?'ANO':'NE')+'</b></div><div>Hlasování: <b>'+m.votes.length+'</b></div></div>'+
    (m.reopened?'<div class="note" style="margin-top:10px">⚠ Schůze byla dodatečně odemčena pro opravu ('+m.reopened+').</div>':'')+'</div>';
  var votes= m.votes.length? '<div class="card"><h2>Usnesení a výsledky</h2>'+voteListHtml(m)+'</div>' : '<div class="card"><p class="small">Žádné hlasování.</p></div>';
  var actions;
  if(!ro){
    actions='<div class="card"><button class="btn big" onclick="go(\'meeting\',\'protokol\')">📄 Náhled protokolu</button>'+
      '<div class="small" style="margin-top:8px">Schůzi ukončíš tlačítkem nahoře u názvu schůze.</div></div>';
  }else{
    actions='<div class="card"><div class="row"><button class="btn big green" onclick="go(\'meeting\',\'protokol\')">📄 Vytvořit protokol schůze</button>'+
      '<button class="btn ghost" onclick="exportCSV()">Export CSV</button></div></div>';
  }
  return summary+votes+actions;
}
function endMeeting(){var m=M();
  if(m.current){alert("Nejdřív uzavři nebo zruš probíhající hlasování.");return;}
  if(!confirm("Ukončit a uzamknout schůzi? Výsledky se zafixují (později lze jen odemknout pro opravu)."))return;
  m.status="closed";save();renderMeeting(document.getElementById("app"));}
function reopenMeeting(){var m=M();
  if(!confirm("Odemknout uzavřenou schůzi pro opravu? Zaznamená se, že byla dodatečně upravena."))return;
  m.status="open";m.reopened=new Date().toLocaleString("cs-CZ");save();renderMeeting(document.getElementById("app"));}

// ===== NASTAVENÍ (master roster) =====
function renderSettings(app){
  var rows=state.roster.map(function(u){return '<tr>'+
    '<td><input type="text" value="'+escapeHtml(u.unit)+'" oninput="setR('+u.id+',\'unit\',this.value)"></td>'+
    '<td><input type="text" value="'+escapeHtml(u.owner)+'" placeholder="jméno vlastníka" oninput="setR('+u.id+',\'owner\',this.value)"></td>'+
    '<td><input type="number" step="0.0001" value="'+u.podil+'" oninput="setPodil('+u.id+',this.value)"></td></tr>';}).join("");
  var s=state.roster.reduce((a,u)=>a+(+u.podil||0),0);
  app.innerHTML='<div class="note">Podíly jsou předvyplněné jako <b>rovné (1/24)</b> — uprav je podle <b>prohlášení vlastníka</b> a doplň jména. Součet musí být 100 %. Změny se projeví v <b>nově</b> zakládaných schůzích (dřívější schůze mají svůj snímek).</div>'+
    '<div class="card"><div class="row spread" style="margin-bottom:8px"><strong>Seznam jednotek a podílů</strong><div>Součet: <b id="ps" style="color:'+(Math.abs(s-100)<0.5?'var(--green)':'var(--red)')+'">'+fmt(s)+' %</b></div></div>'+
    '<table><thead><tr><th>Jednotka</th><th>Vlastník</th><th class="num">Podíl (%)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function setR(id,f,v){state.roster.find(u=>u.id===id)[f]=v;save();}
function setPodil(id,v){state.roster.find(u=>u.id===id).podil=parseFloat((v+"").replace(",","."))||0;save();
  var s=state.roster.reduce((a,u)=>a+(+u.podil||0),0);var el=document.getElementById("ps");if(el){el.textContent=fmt(s)+" %";el.style.color=Math.abs(s-100)<0.5?"var(--green)":"var(--red)";}}

// ===== export / protokol =====
function exportCSV(){var m=M();var L=[["Datum","Typ","Zapisovatel","Č. hlas.","Usnesení","Typ většiny","Výsledek","ANO %","NE %","ZDRŽEL %","Jednotka","Vlastník","Podíl %","Hlas"]];
  m.votes.forEach(function(v){var s=v.snap;s.units.forEach(function(u){
    L.push([dateCz(m.date),m.type,m.zapisovatel,v.num,v.text,s.typeLabel,v.result?"PŘIJATO":"NEPŘIJATO",fmt(s.ano),fmt(s.ne),fmt(s.zdr),u.unit,u.owner||("byt "+u.unit),fmt(u.podil),u.vote]);});});
  var csv="﻿"+L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");
  download("schuze_"+(m.date||"")+".csv",csv,"text/csv");}
function setProtoVariant(v){state.protoVariant=v;save();renderMeeting(document.getElementById("app"));}
function protoHead(m){
  return '<h1>Protokol o schůzi shromáždění společenství vlastníků</h1>'+
    '<p class="center">Společenství vlastníků jednotek v domě č.p. 2553 a 2554, Praha 3</p>'+
    '<p class="center">Datum: <b>'+dateCz(m.date)+(m.time?' '+m.time:'')+'</b> &nbsp;·&nbsp; '+escapeHtml(m.type||'')+' &nbsp;·&nbsp; Zapisovatel: '+escapeHtml(m.zapisovatel||'—')+'</p>'+
    (m.reopened?'<p class="center rd">Pozn.: protokol byl dodatečně upraven ('+escapeHtml(m.reopened)+').</p>':'');
}
function protoSig(m){
  return '<div class="sig"><div>Zapisovatel: '+escapeHtml(m.zapisovatel||'')+'</div><div>Předsedající</div><div>Ověřovatel(é)</div></div>'+
    '<div class="foot">Vygenerováno '+new Date().toLocaleString('cs-CZ')+'.</div>';
}
function renderProtokolFull(m){
  var pp=presentPodil(m),tot=totalPodil(m),q=isQuorate(m);
  var presRows=m.roster.map(function(u){var a=m.att[u.id]||{};
    return '<tr><td>'+u.unit+'</td><td>'+(escapeHtml(u.owner)||'byt '+u.unit)+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td><td>'+(a.present?'Přítomen':'—')+'</td><td>'+escapeHtml(a.note||'')+'</td></tr>';}).join("");
  var presTot='<tr style="background:#f0f0f0"><td colspan="2"><b>Přítomno celkem</b></td><td style="text-align:right"><b>'+fmt(tot>0?pp/tot*100:0)+' %</b></td><td colspan="2"><b>'+presentUnits(m).length+' / '+m.roster.length+' jednotek</b></td></tr>';
  var summ = m.votes.length ? '<table><thead><tr><th>Č.</th><th>Znění usnesení</th><th>Výsledek</th></tr></thead><tbody>'+
      m.votes.map(v=>'<tr><td>'+v.num+'</td><td>'+escapeHtml(v.text||'(bez textu)')+'</td><td><b>'+(v.result?'PŘIJATO':'NEPŘIJATO')+'</b></td></tr>').join('')+'</tbody></table>'
      : '<p>Na schůzi nebylo hlasováno o žádném usnesení.</p>';
  var det=m.votes.map(function(v){var s=v.snap;
    return '<div class="usn keep"><h3>Usnesení č. '+v.num+'</h3><p>'+escapeHtml(v.text||'(bez textu)')+'</p>'+
      '<p style="font-size:.8rem;color:#555">Potřebná většina: '+s.typeLabel+(v.time?' · čas hlasování: '+v.time:'')+'</p>'+
      '<p class="rbig '+(v.result?'grn':'rd')+'">'+(v.result?'USNESENÍ PŘIJATO':'USNESENÍ NEBYLO PŘIJATO')+'</p>'+
      '<p>ANO: '+s.cA+' ('+fmt(s.ano)+' % podílů) &nbsp; NE: '+s.cN+' ('+fmt(s.ne)+' %) &nbsp; ZDRŽEL SE: '+s.cZ+' ('+fmt(s.zdr)+' %)'+(s.un?' &nbsp; nehlasovalo: '+s.un:'')+'</p>'+
      '<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th>Podíl</th><th>Hlas</th></tr></thead><tbody>'+
      s.units.map(u=>'<tr><td>'+u.unit+'</td><td>'+(escapeHtml(u.owner)||'byt '+u.unit)+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td><td>'+u.vote+'</td></tr>').join('')+'</tbody></table></div>';}).join('');
  return '<div id="protokol">'+protoHead(m)+
    '<h2>1. Účast a usnášeníschopnost</h2>'+
    '<p>Na schůzi bylo přítomno '+presentUnits(m).length+' z '+m.roster.length+' bytových jednotek, představujících '+fmt(tot>0?pp/tot*100:0)+' % vlastnických podílů. '+
    'Schůze <b>'+(q?'byla usnášeníschopná':'nebyla usnášeníschopná')+'</b> (usnášeníschopnost vyžaduje přítomnost více než 50 % vlastnických podílů).</p>'+
    '<table><thead><tr><th>Jedn.</th><th>Vlastník</th><th>Podíl</th><th>Účast</th><th>Zastoupení / pozn.</th></tr></thead><tbody>'+presRows+presTot+'</tbody></table>'+
    '<h2>2. Přehled projednaných usnesení</h2>'+summ+
    '<h2>3. Jednotlivá usnesení a výsledky hlasování</h2>'+(det||'<p>Bez hlasování.</p>')+
    protoSig(m)+'</div>';
}
function renderProtokolSimple(m){
  var pp=presentPodil(m),tot=totalPodil(m),q=isQuorate(m);
  var pres=presentUnits(m);
  var presRows=pres.map(function(u){
    return '<tr><td>'+u.unit+'</td><td>'+(escapeHtml(u.owner)||'byt '+u.unit)+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td></tr>';}).join("");
  var presTot='<tr style="background:#f0f0f0"><td colspan="2"><b>Přítomno celkem</b></td><td style="text-align:right"><b>'+fmt(tot>0?pp/tot*100:0)+' %</b></td></tr>';
  var presTable = pres.length
    ? '<table><thead><tr><th>Jednotka</th><th>Vlastník</th><th>Podíl</th></tr></thead><tbody>'+presRows+presTot+'</tbody></table>'
    : '<p>Nebyl přítomen nikdo.</p>';
  var usn = m.votes.length ? m.votes.map(function(v){var s=v.snap;
    return '<div class="usn keep"><p class="usn-t"><b>Usnesení č. '+v.num+' – '+escapeHtml(v.text||'(bez textu)')+'</b></p>'+
      '<p class="rbig '+(v.result?'grn':'rd')+'"><b>Výsledek: '+(v.result?'PŘIJATO':'NEPŘIJATO')+'</b></p>'+
      '<p>ANO: '+s.cA+' ('+fmt(s.ano)+' % podílů)<br>NE: '+s.cN+' ('+fmt(s.ne)+' % podílů)<br>ZDRŽEL SE: '+s.cZ+' ('+fmt(s.zdr)+' % podílů)'+(s.un?'<br>nehlasovalo: '+s.un:'')+'</p></div>';}).join('')
    : '<p>Na schůzi nebylo hlasováno o žádném usnesení.</p>';
  return '<div id="protokol">'+protoHead(m)+
    '<h2>1. Prezence</h2>'+
    '<p>Přítomno '+pres.length+' z '+m.roster.length+' jednotek, '+fmt(tot>0?pp/tot*100:0)+' % vlastnických podílů — schůze <b>'+(q?'byla usnášeníschopná':'nebyla usnášeníschopná')+'</b>.</p>'+
    presTable+
    '<h2>2. Přehled usnesení a výsledky hlasování</h2>'+usn+
    protoSig(m)+'</div>';
}
function renderProtokol(m){
  var variant=state.protoVariant||"full";
  var doc = variant==="simple" ? renderProtokolSimple(m) : renderProtokolFull(m);
  var sw='<div class="proto-switch">'+
    '<span class="small" style="font-weight:700">Varianta:</span>'+
    '<label><input type="radio" name="pv" '+(variant!=="simple"?'checked':'')+' onclick="setProtoVariant(\'full\')"> Kompletní protokol</label>'+
    '<label><input type="radio" name="pv" '+(variant==="simple"?'checked':'')+' onclick="setProtoVariant(\'simple\')"> Zjednodušený protokol</label></div>';
  var bar='<div class="protobar"><button class="btn ghost" onclick="go(\'meeting\',\'prehled\')">← Zpět</button>'+
    '<button class="btn big" onclick="window.print()">🖨 Vytisknout / Uložit jako PDF</button></div>';
  return bar+sw+doc;
}
function printProtokol(){var m=M(),pp=presentPodil(m),tot=totalPodil(m);
  var pres=presentUnits(m).map(u=>{var a=m.att[u.id]||{};return '<tr><td>'+u.unit+'</td><td>'+(u.owner||'byt '+u.unit)+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td><td>'+(a.proxy||a.note?'plná moc / '+ (a.note||''):'')+'</td></tr>';}).join("");
  var votes=m.votes.map(function(v){var s=v.snap;
    return '<h3>Hlasování č. '+v.num+' — '+escapeHtml(v.text||"(bez textu)")+'</h3>'+
    '<p><b>'+(v.result?'PŘIJATO':'NEPŘIJATO')+'</b> · '+s.typeLabel+(v.time?' · '+v.time:'')+'<br>ANO '+s.cA+' ('+fmt(s.ano)+' %), NE '+s.cN+' ('+fmt(s.ne)+' %), ZDRŽEL '+s.cZ+' ('+fmt(s.zdr)+' %)'+(s.un?', nehlasovalo '+s.un:'')+'</p>'+
    '<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:11px"><tr><th>Jedn.</th><th>Vlastník</th><th>Podíl</th><th>Hlas</th></tr>'+
    s.units.map(u=>'<tr><td>'+u.unit+'</td><td>'+(u.owner||'byt '+u.unit)+'</td><td style="text-align:right">'+fmt(u.podil)+' %</td><td>'+u.vote+'</td></tr>').join("")+'</table>';}).join("<hr>");
  var w=window.open("","_blank");
  w.document.write('<html><head><meta charset="utf-8"><title>Protokol schůze '+dateCz(m.date)+'</title></head><body style="font-family:Arial;padding:24px;color:#111">'+
    '<h1>Protokol o schůzi shromáždění SVJ</h1><p><b>Buková 2553 a 2554, Praha 3</b></p>'+
    '<p>Datum: <b>'+dateCz(m.date)+(m.time?' '+m.time:'')+'</b> · Typ: '+escapeHtml(m.type||'')+' · Zapisovatel: '+escapeHtml(m.zapisovatel||'—')+'</p>'+
    (m.reopened?'<p style="color:#b06000">Pozn.: schůze byla dodatečně odemčena pro opravu ('+m.reopened+').</p>':'')+
    '<h2>Usnášeníschopnost</h2><p>Přítomno '+presentUnits(m).length+' z '+m.roster.length+' jednotek, '+fmt(tot>0?pp/tot*100:0)+' % podílů — <b>'+(isQuorate(m)?'usnášeníschopná':'NEusnášeníschopná')+'</b>.</p>'+
    '<h2>Prezenční listina</h2><table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:11px"><tr><th>Jedn.</th><th>Vlastník</th><th>Podíl</th><th>Zastoupení / pozn.</th></tr>'+pres+'</table>'+
    '<h2>Usnesení a hlasování</h2>'+(votes||'<p>Žádné hlasování.</p>')+
    '<br><br><p>Zapsal: '+escapeHtml(m.zapisovatel||'')+' &nbsp;&nbsp; Podpisy: ......................... &nbsp; .........................</p>'+
    '</body></html>');
  w.document.close();w.focus();setTimeout(()=>w.print(),300);}
function download(n,c,t){var b=new Blob([c],{type:t});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function backup(){download("svj_schuze_zaloha.json",JSON.stringify(state,null,2),"application/json");}
function restore(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{state=JSON.parse(r.result);state.screen="home";save();render();}catch(e){alert("Neplatný soubor.");}};r.readAsText(f);}

render();
</script>
</body>
